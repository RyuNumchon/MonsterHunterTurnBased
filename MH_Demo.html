<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Monster Hunt: Mountain Stream</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =====================================================================
   STEP 0 — PRESENTATION (Gen-3 look; cqw = 1% of the game width)
   ===================================================================== */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        background: #181c22;
        color: #f0f0f0;
      }
      body {
        font-family: "Press Start 2P", "Courier New", monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 8px;
        min-height: 100vh;
      }
      button {
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
      }
      .hidden {
        display: none !important;
      }
      img,
      canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .pi {
        width: 1.6em;
        height: 1.6em;
        vertical-align: middle;
        flex: none;
      }
      .pi.big {
        width: 2.4em;
        height: 2.4em;
      }

      #topbar {
        width: min(100%, 900px);
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      #topbar h1 {
        font-size: 11px;
        color: #f8c040;
        margin: 0 6px 0 0;
      }
      .tbtn {
        background: #2c343e;
        color: #fff;
        border: 2px solid #4a5666;
        border-radius: 6px;
        padding: 6px 9px;
        font-size: 9px;
      }
      .tbtn:hover {
        border-color: #f8c040;
      }
      #phases {
        margin-left: auto;
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
      }
      .ph {
        padding: 4px 6px;
        border-radius: 4px;
        background: #2c343e;
        color: #7a8696;
        font-size: 8px;
      }
      .ph.on {
        background: #f8c040;
        color: #222;
      }

      #gb {
        width: min(100%, 900px);
        container-type: inline-size;
        border: 4px solid #3a424c;
        border-radius: 12px;
        overflow: hidden;
        background: #283038;
        box-shadow: 0 8px 30px #0008;
        user-select: none;
        -webkit-user-select: none;
      }
      #screen {
        position: relative;
        aspect-ratio: 3/2;
        overflow: hidden;
        font-size: clamp(7px, 1.75cqw, 16px);
        background: #101418;
      }
      #fieldCv {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      /* ---------- Battle scene (background is a pixel canvas baked per area theme) ---------- */
      #battle {
        position: absolute;
        inset: 0;
        z-index: 2;
        overflow: hidden;
        background: #68a0c8 0 0/100% 100% no-repeat;
      }
      .sprite {
        position: absolute;
        line-height: 0;
      }
      .sprite img {
        width: 100%;
        display: block;
      }
      #enemySprite {
        left: 56%;
        bottom: 55%;
        width: 37.5%;
        z-index: 2;
      }
      #enemySprite.small {
        left: 64%;
        width: 22%;
      }
      #playerSprite {
        left: 6%;
        bottom: -4%;
        width: 34%;
        z-index: 3;
      }
      #playerSprite.chg1 img {
        filter: drop-shadow(0 0 0.15em #ffd040) drop-shadow(0 0 0.3em #ffd040);
      }
      #playerSprite.chg2 img {
        filter: drop-shadow(0 0 0.2em #ff8020) drop-shadow(0 0 0.5em #ff3000);
      }
      #playerSprite.chg2 {
        animation: pulse 0.5s infinite;
      }
      #playerSprite.guard img {
        filter: drop-shadow(0 0 0.3em #60a0ff);
      }
      #enemySprite.trapped img {
        filter: drop-shadow(0 0 0.2em #ffe040) drop-shadow(0 0 0.4em #ffe040);
      }
      #enemySprite.trapped {
        animation: zap 0.2s infinite;
      }
      #enemySprite.corpse img {
        transform: translateY(10%) rotate(6deg) scaleY(0.85);
        filter: grayscale(0.6) brightness(0.8);
        transition:
          transform 0.6s,
          filter 0.6s;
      }
      .zzz {
        position: absolute;
        right: 5%;
        top: 0;
        font-size: 1.4em;
        line-height: 1;
        color: #4050b0;
        text-shadow: 0.1em 0.1em 0 #fff;
        animation: zzz 1.8s infinite;
      }
      .gone {
        visibility: hidden;
      }

      .ibox {
        position: absolute;
        z-index: 4;
        background: linear-gradient(#f8f8e8, #e8ecd0);
        color: #383838;
        border: 0.28em solid #48505a;
        box-shadow:
          inset 0 0 0 0.18em #b8c0a0,
          0.25em 0.25em 0 #0003;
        padding: 0.6em 0.9em;
      }
      #enemyBox {
        left: 3%;
        top: 5%;
        width: 46%;
        border-radius: 0.3em 1.4em 0.3em 1.4em;
      }
      #playerBox {
        right: 2%;
        bottom: 3%;
        width: 46%;
        border-radius: 1.4em 0.3em 1.4em 0.3em;
      }
      .nm {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.05em;
        margin-bottom: 0.4em;
        gap: 0.4em;
      }
      .lv {
        font-size: 0.75em;
        color: #586068;
      }
      .hpr {
        display: flex;
        align-items: center;
        gap: 0.35em;
        background: #48505a;
        border-radius: 0.5em;
        padding: 0.18em 0.3em 0.18em 0.5em;
      }
      .hpr b {
        color: #f8b800;
        font-size: 0.7em;
      }
      .trk {
        flex: 1;
        height: 0.6em;
        background: #5a6860;
        border-radius: 0.25em;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 0.12em 0 #0004;
      }
      .fill {
        height: 100%;
        width: 100%;
        transition:
          width 0.7s ease,
          background-color 0.3s;
        box-shadow: inset 0 0.15em 0 #fff6;
      }
      .hpnum {
        text-align: right;
        font-size: 1em;
        margin: 0.35em 0.2em 0.25em;
      }
      .parts {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.45em;
        margin-top: 0.45em;
      }
      .pt span {
        display: block;
        font-size: 0.5em;
        margin-bottom: 0.2em;
      }
      .pt .trk {
        height: 0.4em;
      }
      .pt.brk span {
        color: #c03030;
        text-decoration: line-through;
      }
      .sharp {
        display: flex;
        align-items: center;
        gap: 0.35em;
      }
      .sharp b {
        font-size: 0.55em;
        color: #48505a;
      }
      .sharp .trk {
        height: 0.42em;
        background: #3a4440;
      }
      .sharp .trk i {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 0.12em;
        background: #000a;
      }
      .gauge {
        font-size: 0.55em;
        margin-top: 0.5em;
        display: flex;
        justify-content: space-between;
        gap: 0.4em;
        align-items: center;
      }
      .pip {
        display: inline-block;
        width: 0.95em;
        height: 0.95em;
        border-radius: 50%;
        background: #c8ccb8;
        border: 0.12em solid #48505a;
        vertical-align: middle;
        margin-left: 0.15em;
      }
      .pip.on {
        background: #f8a020;
      }
      .balls {
        display: inline-flex;
        gap: 0.25em;
        align-items: center;
      }
      .ball {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        border-radius: 50%;
        border: 0.1em solid #303030;
        background: linear-gradient(
          #e83838 0 44%,
          #303030 44% 56%,
          #f8f8f8 56%
        );
      }
      .ball.used {
        background: #9a9a9a;
        opacity: 0.55;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.3em;
        margin-top: 0.4em;
        min-height: 0.9em;
      }
      .chip {
        font-size: 0.55em;
        padding: 0.3em 0.45em;
        border-radius: 0.3em;
        color: #fff;
        line-height: 1;
      }
      .c-slp {
        background: #9068c0;
      }
      .c-bln {
        background: #c89818;
      }
      .c-pnt {
        background: #e05090;
      }
      .c-cut {
        background: #906040;
      }
      .c-crk {
        background: #b04838;
      }
      .c-stun {
        background: #d06020;
      }
      .c-mgt {
        background: #d04040;
      }
      .c-grd {
        background: #4870c0;
      }
      .c-fs {
        background: #30a0a0;
      }
      .c-trap {
        background: #b89010;
      }
      .c-tq {
        background: #6a58a8;
      }
      .c-cap {
        background: #401818;
      }
      .pop {
        position: absolute;
        z-index: 7;
        font-size: 1.7em;
        color: #fff;
        pointer-events: none;
        white-space: nowrap;
        text-shadow:
          0.12em 0.12em 0 #c02020,
          -0.06em -0.06em 0 #c02020;
        animation: floatUp 0.9s forwards;
      }
      .pop.heal {
        text-shadow:
          0.12em 0.12em 0 #208040,
          -0.06em -0.06em 0 #208040;
      }
      .pop.loot {
        font-size: 0.9em;
        text-shadow:
          0.12em 0.12em 0 #806010,
          -0.06em -0.06em 0 #806010;
        animation-duration: 1.4s;
      }
      #flashFx {
        position: absolute;
        inset: 0;
        background: #fff;
        opacity: 0;
        pointer-events: none;
        z-index: 6;
      }
      #flashFx.flashing {
        animation: flashfx 0.7s;
      }

      /* ---------- Field overlays ---------- */
      #locPop {
        position: absolute;
        left: 3%;
        top: 0;
        z-index: 5;
        background: linear-gradient(#f8f0d0, #e4d4a4);
        color: #503818;
        border: 0.3em solid #806030;
        border-top: none;
        border-radius: 0 0 0.6em 0.6em;
        padding: 0.7em 1.1em;
        font-size: 0.85em;
        line-height: 1.7;
        transform: translateY(-110%);
        transition: transform 0.35s;
        pointer-events: none;
      }
      #locPop small {
        font-size: 0.75em;
        color: #806040;
      }
      #locPop.show {
        transform: none;
      }
      #toast {
        position: absolute;
        left: 50%;
        bottom: 4%;
        transform: translateX(-50%);
        z-index: 5;
        background: #000c;
        color: #fff;
        font-size: 0.62em;
        padding: 0.7em 0.9em;
        border-radius: 0.4em;
        opacity: 0;
        transition: opacity 0.3s;
        max-width: 70%;
        line-height: 1.7;
        white-space: pre-line;
        pointer-events: none;
        text-align: center;
      }
      #toast.show {
        opacity: 1;
      }
      #fDialog {
        position: absolute;
        left: 2%;
        right: 2%;
        bottom: 3%;
        z-index: 8;
        background: #f8f8f8;
        color: #383838;
        border: 0.35em solid #5870c0;
        box-shadow:
          inset 0 0 0 0.22em #c8d8f8,
          0 0.2em 0 #0005;
        border-radius: 0.6em;
        padding: 0.9em 1.3em;
        min-height: 6.2em;
        font-size: 1.05em;
        line-height: 2;
        white-space: pre-line;
        cursor: pointer;
      }
      #fMenu {
        position: absolute;
        right: 2%;
        top: 3%;
        z-index: 9;
        max-height: 94%;
        overflow: auto;
      }
      #fMenu.yn {
        top: auto;
        bottom: 32%;
        right: 3%;
      }
      .menu {
        background: #f8f8f8;
        color: #383838;
        border: 0.35em solid #5870c0;
        border-radius: 0.6em;
        box-shadow: inset 0 0 0 0.22em #c8d8f8;
        padding: 0.5em;
        display: flex;
        flex-direction: column;
        gap: 0.1em;
        min-width: 12em;
        max-width: 62cqw;
        line-height: 1.8;
        font-size: 0.9em;
      }
      .mh {
        font-size: 0.8em;
        color: #5870c0;
        border-bottom: 0.15em solid #c8d8f8;
        margin-bottom: 0.3em;
        padding-bottom: 0.2em;
      }
      .mi {
        background: none;
        border: none;
        text-align: left;
        font-size: 1em;
        color: #383838;
        padding: 0.35em 0.5em 0.35em 1.6em;
        position: relative;
        border-radius: 0.3em;
        line-height: 1.4;
        display: flex;
        gap: 0.6em;
        align-items: center;
      }
      .mi.focus {
        background: #eef2fa;
      }
      .mi.focus::before {
        content: "▶";
        position: absolute;
        left: 0.4em;
        color: #e05050;
      }
      .mi:disabled {
        color: #b0b0b0;
      }
      .mi:disabled img {
        filter: grayscale(1);
        opacity: 0.5;
      }
      .mi .q {
        margin-left: auto;
      }
      .mdesc {
        font-size: 0.68em;
        color: #606878;
        border-top: 0.15em solid #c8d8f8;
        margin-top: 0.3em;
        padding-top: 0.5em;
        min-height: 3.4em;
        line-height: 1.7;
      }

      /* ---------- Always-on minimap (field only) ---------- */
      #mini {
        position: absolute;
        top: 2%;
        right: 2%;
        width: 27%;
        aspect-ratio: 5/4;
        z-index: 5;
        background: #86a858;
        border: 0.25em solid #34402a;
        border-radius: 0.4em;
        box-shadow: 0.2em 0.2em 0 #0006;
        overflow: hidden;
        cursor: pointer;
      }
      #mini svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .mblob {
        position: absolute;
        width: 15%;
        height: 15%;
        transform: translate(-50%, -50%);
        border: 0.15em solid #34402a;
        border-radius: 42% 58% 48% 52%/55% 45% 55% 45%;
      }
      .mblob.camp {
        width: 10%;
        height: 10%;
        border-radius: 0.2em;
      }
      .mblob.cur {
        box-shadow: 0 0 0 0.2em #f8e060;
      }
      .mnum {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 0.5em;
        color: #fff;
        z-index: 2;
        text-shadow:
          0.12em 0 #111,
          -0.12em 0 #111,
          0 0.12em #111,
          0 -0.12em #111;
      }
      .mmk {
        position: absolute;
        width: 11%;
        transform: translate(-50%, -85%);
        z-index: 3;
      }
      .mmk.mon {
        width: 22%;
        animation: mkbob 0.5s infinite alternate;
      }
      .mtag {
        position: absolute;
        left: 3%;
        bottom: 3%;
        font-size: 0.36em;
        color: #f8f8e0;
        z-index: 4;
        text-shadow: 0.12em 0.12em 0 #2a3420;
      }

      /* ---------- Full map overlay (Mountain Stream) ---------- */
      #mapOv {
        position: absolute;
        inset: 0;
        z-index: 10;
        background: #5e7c3c;
        display: flex;
        padding: 2%;
        gap: 2%;
      }
      .mapL {
        position: relative;
        flex: 1;
        background: #86a858;
        border: 0.3em solid #34402a;
        border-radius: 0.4em;
        overflow: hidden;
      }
      .mapL svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .mapTitle {
        position: absolute;
        top: 2%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 1.15em;
        color: #f8f8e0;
        z-index: 4;
        white-space: nowrap;
        text-shadow:
          0.1em 0 #2a3420,
          -0.1em 0 #2a3420,
          0 0.1em #2a3420,
          0 -0.1em #2a3420;
      }
      .blob {
        position: absolute;
        width: 13%;
        height: 15%;
        transform: translate(-50%, -50%);
        border: 0.22em solid #34402a;
        border-radius: 42% 58% 48% 52%/55% 45% 55% 45%;
        box-shadow: inset 0 0 0 0.25em #ffffff30;
      }
      .blob.camp {
        width: 8%;
        height: 10%;
        border-radius: 0.4em;
      }
      .anum {
        position: absolute;
        transform: translate(-50%, -50%);
        font-size: 1.5em;
        color: #fff;
        z-index: 2;
        text-shadow:
          0.12em 0 #111,
          -0.12em 0 #111,
          0 0.12em #111,
          0 -0.12em #111;
      }
      .anum.cur {
        color: #f8e060;
      }
      .gics {
        position: absolute;
        transform: translate(-50%, -50%);
        white-space: nowrap;
        z-index: 2;
        display: flex;
        gap: 0.1em;
      }
      .gics img {
        width: 1.3em;
        height: 1.3em;
      }
      .mk {
        position: absolute;
        width: 6%;
        transform: translate(-50%, -90%);
        z-index: 3;
        animation: mkbob 0.5s infinite alternate;
      }
      .mk.mon {
        width: 11%;
      }
      .mk.npc {
        width: 4%;
        animation: none;
      }
      .legend {
        width: 26%;
        background: #d8e8b0;
        color: #283818;
        border: 0.3em solid #34402a;
        border-radius: 0.4em;
        padding: 0.6em;
        font-size: 0.55em;
        line-height: 2;
        overflow: auto;
        display: flex;
        flex-direction: column;
      }
      .legend div {
        display: flex;
        align-items: center;
        gap: 0.5em;
      }
      .lgh {
        font-size: 1.4em;
        justify-content: center;
        border-bottom: 0.2em solid #34402a;
        margin-bottom: 0.3em;
      }
      .lgs {
        margin-top: 0.5em;
        padding-top: 0.4em;
        border-top: 0.2em solid #34402a;
        line-height: 1.9;
        display: block !important;
      }
      .legend .mi {
        font-size: 1.3em;
        margin-top: auto;
        background: #f8f8f8;
        border: 0.15em solid #34402a;
      }

      /* ---------- Rewards / storage overlay (Monster Hunter style) ---------- */
      #rewardOv {
        position: absolute;
        inset: 0;
        z-index: 12;
        background: linear-gradient(#2c2218, #120d08);
        color: #f0e0b0;
        padding: 3%;
        display: flex;
        flex-direction: column;
        gap: 2%;
        font-size: 0.8em;
      }
      .rhead {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 1em;
        border-bottom: 0.2em solid #c8a050;
        padding-bottom: 0.5em;
        flex-wrap: wrap;
      }
      .rhead h3 {
        margin: 0;
        color: #f8c850;
        font-size: 1.5em;
        text-shadow: 0.1em 0.1em 0 #603010;
      }
      .rhead.fail h3 {
        color: #f07050;
      }
      .rhead span {
        font-size: 0.75em;
        color: #c8a878;
        line-height: 1.6;
      }
      .rbody {
        flex: 1;
        overflow: auto;
        padding-right: 0.4em;
      }
      .rsec h4 {
        margin: 0.6em 0 0.4em;
        font-size: 0.75em;
        color: #c8a878;
        letter-spacing: 0.05em;
      }
      .rsec.bonus h4 {
        color: #f8e070;
      }
      .rgrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.4em;
      }
      .slot {
        background: #3a2e20;
        border: 0.15em solid #6a5236;
        border-radius: 0.3em;
        padding: 0.35em 0.5em;
        font-size: 0.68em;
        display: flex;
        gap: 0.5em;
        align-items: center;
        line-height: 1.5;
        animation: slotIn 0.35s backwards;
      }
      .slot .iname {
        flex: 1;
        min-width: 0;
      }
      .slot small {
        font-size: 0.75em;
        opacity: 0.7;
      }
      .r1 {
        border-color: #8a8a8a;
      }
      .r2 {
        border-color: #6aa050;
      }
      .r3 {
        border-color: #4a88c0;
      }
      .r4 {
        border-color: #c09030;
      }
      .r5 {
        border-color: #c060b0;
      }
      .r6 {
        border-color: #e05038;
      }
      .zen {
        margin-top: 0.8em;
        font-size: 0.85em;
        color: #f8e0a0;
        line-height: 1.8;
      }
      .zen small {
        font-size: 0.75em;
        color: #c8a878;
      }
      .ftxt {
        line-height: 2;
        font-size: 0.9em;
      }
      .rbtns {
        display: flex;
        gap: 0.6em;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
      }
      .rbtn {
        background: #c89a40;
        color: #201408;
        border: 0.2em solid #f0d080;
        border-radius: 0.4em;
        padding: 0.7em 1em;
        font-size: 0.85em;
      }
      .rbtn:hover {
        filter: brightness(1.12);
      }
      .rbtn.big {
        font-size: 1.1em;
        padding: 0.9em 2em;

          inset 0 -0.35em 0 #0003,

      /* ---------- Animations ---------- */

          opacity: 0;

          background: #fff;

          background: #fff;
        }

      @container (max-width:600px) {

    </style>

  <body>
    <div id="topbar">
      <h1>MONSTER HUNT</h1>
      <button class="tbtn" data-act="reset">⟲ RESTART HUNT</button>
      <button class="tbtn" data-act="mute" id="muteBtn">♪ MUSIC: ON</button>

        BATTLE TEXT: AUTO
      </button>
      <div id="phases">
        <span class="ph" data-p="1">1 ITEMS</span
        ><span class="ph" data-p="2">2 ACTION</span>
        <span class="ph" data-p="3">3 HIT CALC</span
        ><span class="ph" data-p="4">4 MONSTER</span>

    </div>

    <div id="gb">
      <div id="screen">
        <canvas id="fieldCv" width="480" height="320"></canvas>

        <div id="battle" class="hidden">
          <div id="enemySprite" class="sprite">
            <img alt="" /><span class="zzz">Z z</span>
          </div>
          <div id="playerSprite" class="sprite"><img alt="" /></div>
          <div id="enemyBox" class="ibox">
            <div class="nm">
              <span id="eName"></span><span class="lv" id="eRank"></span>
            </div>

              <div class="trk"><div class="fill" id="eHp"></div></div>
            </div>

            <div class="chips" id="eChips"></div>
          </div>

            <div class="nm">
              <span>HUNTER <span class="lv" id="pWpn"></span></span
              ><span class="balls" id="pBalls"></span>
            </div>
            <div class="hpr">
              <b>HP</b>
              <div class="trk"><div class="fill" id="pHp"></div></div>
            </div>
            <div class="hpnum" id="pHpNum"></div>
            <div class="sharp">
              <b>EDGE</b>
              <div class="trk">
                <div class="fill" id="pSharp"></div>
                <i></i><i></i>
              </div>
            </div>
            <div class="gauge">
              <span id="pGauge"></span><span id="pSharpLbl"></span>

    <details id="logWrap">
      <summary>BATTLE LOG (rolls &amp; damage formulas)</summary>
      <div id="log"></div>
    </details>

    <script>
      "use strict";
      /* =====================================================================
   STEP 1 — UTILITIES
   ===================================================================== */
      const $ = (id) => document.getElementById(id);
      const rand = (a, b) => Math.random() * (b - a) + a;
      const randInt = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      class Abort extends Error {} // thrown to cancel an in-progress sequence after a restart

      // Seeded RNG (mulberry32): the same seed always builds the same area layout
      function rng32(seed) {
        return function () {
          seed |= 0;
          seed = (seed + 0x6d2b79f5) | 0;
          let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      // Weighted loot roll. Table rows: [name, weight, rarity]
      function weighted(table, rnd = Math.random) {
        const total = table.reduce((s, e) => s + e[1], 0);
        let r = rnd() * total;
        for (const e of table) {
          r -= e[1];
          if (r < 0) return { name: e[0], rar: e[2] || 1 };
        }
        const e = table[table.length - 1];
        return { name: e[0], rar: e[2] || 1 };
      }

      /* =====================================================================
   STEP 2 — TUNING CONSTANTS
   ===================================================================== */
      const CONFIG = {
        PLAYER_MAX_HP: 150,
        MAX_CARTS: 3,
        MAX_ITEMS_PER_TURN: 3,
        // Sharpness (PP equivalent), 40 points:
        //   Green 26–40: DMG ×1.2, Hit +10 | Yellow 13–25: ×1.0 | Red 0–12: BOUNCE ×0.5, Hit −10, 5% max-HP recoil
        SHARP_MAX: 40,
        SHARP_GREEN: 26,
        SHARP_YELLOW: 13,
        BOUNCE_RECOIL_PCT: 0.05,
        OVERALL_HIT: 90,
        MONSTER_HIT: 60,
        MONSTER_HIT_FLASHED: 30,
        MIGHT_MULT: 1.25,
        WAKE_MULT: 2,
        GUARD_TAKEN: 0.4,
        HEAVY_INTERRUPT_CHANCE: 0.3,
        FLEE_MIN: 4,
        FLEE_MAX: 6,
        FLEE_CHANCE: 0.5,
        LOW_HP_FLEE: 0.25,
        LOW_HP_FLEE_CHANCE: 0.4,
        REST_HEAL_PCT: 0.03,
        SLEEP_CHANCE: 0.35,
        NEST_SLEEP_CHANCE: 0.8,
        WAKE_AFTER: 6,
        ROAM_CHANCE: 0.5,
        TAIL_ATK_MULT: 0.75,
        BODY_CRACK_MULT: 1.1,
        CAPTURE_PCT: 0.25,
        TRAP_TURNS_FIRST: 3,
        TRAP_TURNS_AFTER: 2,
        TRAP_HIT_BONUS: 25,
        TRANQ_NEEDED: 2,
        CARVES: 3,
        SMALL_CARVES: 1,
        MAIN_REWARDS: 4,
        CAPTURE_MAIN_REWARDS: 5,
        CAPTURE_BONUS: 3,
        CAPTURE_ZENNY_MULT: 1.2,
        // Field movement (ms per tile). Monsters chasing you are FASTER than you.
        MOVE_MS: 150,
        BOSS_CHASE_MS: 95,
        SMALL_CHASE_MS: 115,
        WANDER_MS: 320,
        ESCAPE_CHANCE: 0.75,
        GRACE_MS: 2500,
        BOSS_AGGRO: 5,
        GATHER_USES: 2,
        START_ZENNY: 1500,
        TEXT_SPEED: 14,
        AUTO_ADVANCE: 900,
        AUTO: true,
      };
      const CHARGE_MULT = [1, 2, 3]; // Great Sword: Charge, Charge, then Release on turn 3 = Lv3 (3×)

      /* =====================================================================
   STEP 3 — COMBAT DATA
   ===================================================================== */
      function getSharp(s) {
        if (s >= CONFIG.SHARP_GREEN)
          return {
            name: "GREEN",
            color: "#4cc76a",
            text: "#208838",
            dmg: 1.2,
            hit: 10,
            bounce: false,
          };
        if (s >= CONFIG.SHARP_YELLOW)
          return {
            name: "YELLOW",
            color: "#e6c84a",
            text: "#9a7a00",
            dmg: 1.0,
            hit: 0,
            bounce: false,
          };
        return {

      function genArea(id) {
        const A = AREAS[id],
          th = THEMES[A.theme],
          r = rng32(9000 + id * 101);
        const g = [];
        for (let y = 0; y < MH; y++) {
          const row = [];
          for (let x = 0; x < MW; x++) {
            const v = r();

              v < th.tall ? "," : v < th.tall + th.flower ? "f" : th.ground,
            );
          }
          g.push(row);
        }
        for (let y = 0; y < MH; y++)
          for (let x = 0; x < MW; x++) {
            const e = Math.min(x, y, MW - 1 - x, MH - 1 - y);
            if (e === 0 || (e === 1 && r() < 0.55)) g[y][x] = th.border;
          }
        if (th.feature === "streamV")
          for (let y = 0; y < MH; y++)
            for (let x = 4; x <= 5; x++)
              g[y][x] = y === 9 || y === 10 ? "-" : "~";
        if (th.feature === "riverH")
          for (let y = 4; y <= 5; y++)
            for (let x = 0; x < MW; x++) g[y][x] = "~";
        if (th.feature === "pool")
          for (let y = 1; y <= 4; y++)
            for (let x = 5; x <= 18; x++)
              g[y][x] = y === 1 && x >= 9 && x <= 14 ? "w" : "~";
        for (let i = 0; i < th.clusters; i++) {
          const cx = 2 + Math.floor(r() * (MW - 4)),
            cy = 2 + Math.floor(r() * (MH - 4)),
            rad = 1 + Math.floor(r() * 2);
          for (let dy = -rad; dy <= rad; dy++)
            for (let dx = -rad; dx <= rad; dx++) {
              const x = cx + dx,
                y = cy + dy;
              if (x < 1 || y < 1 || x > MW - 2 || y > MH - 2) continue;
              if (
                dx * dx + dy * dy <= rad * rad + 1 &&
                r() < 0.75 &&
                !WATERS.has(g[y][x])
              )
                g[y][x] = th.obs;
            }
        }
        if (th.bones)
          for (let y = 1; y < MH - 1; y++)
            for (let x = 1; x < MW - 1; x++)
              if (g[y][x] === th.ground && r() < th.bones) g[y][x] = "x";
        if (A.theme === "camp")
          for (let y = 2; y <= 7; y++)
            for (let x = 8; x <= 20; x++) g[y][x] = th.ground;

        const exits = [],
          bySide = { N: [], S: [], E: [], W: [] };
        neighbors(id).forEach((to) => bySide[sideTo(id, to)].push(to));
        for (const s in bySide) {
          const list = bySide[s],
            horiz = s === "N" || s === "S";
          list.sort((a, b) =>
            horiz ? AREAS[a].mx - AREAS[b].mx : AREAS[a].my - AREAS[b].my,
          );
          list.forEach((to, i) => {
            const span = horiz ? MW : MH,
              pos = Math.round(3 + ((span - 7) * (i + 1)) / (list.length + 1));
            const x = s === "W" ? 0 : s === "E" ? MW - 1 : pos,
              y = s === "N" ? 0 : s === "S" ? MH - 1 : pos;
            const [ix, iy, idir] = SIDE_IN[s];
            exits.push({ x, y, to, ix, iy, idir, side: s });
          });

          const c = g[y][x];
          if (c === "E") return;
          g[y][x] = WATERS.has(c) ? "-" : th.path;
          carved.add(x + "," + y);

          g[e.y][e.x] = "E";
          let x = e.x + e.ix,
            y = e.y + e.iy;
          carve(x, y);
          x += e.ix;
          y += e.iy;
          carve(x, y);
          const stepX = () => {
            while (x !== CXT) {
              x += Math.sign(CXT - x);
              carve(x, y);
            }
          };
          const stepY = () => {
            while (y !== CYT) {
              y += Math.sign(CYT - y);
              carve(x, y);
            }
          };
          if (r() < 0.5) {
            stepX();
            stepY();

            stepY();
            stepX();

                at(x + 1, y),
                at(x, y - 1),

            const k = (y * W + x) * 4;
            d[k] = rgb[0];
            d[k + 1] = rgb[1];
            d[k + 2] = rgb[2];

      /* ---------- Tiles (16×16) ---------- */
      const TILES = {},

      function paint(fn) {
        const c = document.createElement("canvas");

      function speck(x, r, base, dots) {
        x.fillStyle = base;
        x.fillRect(0, 0, 16, 16);
        dots.forEach(([col, n]) => {
          x.fillStyle = col;
          for (let i = 0; i < n; i++)

        });

      const variants = (n, seed, fn) =>

      function drawPine(x) {
        const rows = [
          [1, 7, 8],
          [2, 6, 9],
          [3, 5, 10],
          [4, 4, 11],
          [5, 5, 10],
          [6, 3, 12],
          [7, 2, 13],
          [8, 4, 11],
          [9, 2, 13],
          [10, 1, 14],
          [11, 1, 14],
          [12, 3, 12],
        ];
        x.fillStyle = "#00000033";
        x.fillRect(3, 14, 11, 2);
        x.fillStyle = "#7a5030";
        x.fillRect(7, 12, 3, 4);
        rows.forEach(([y, a, b]) => {
          x.fillStyle = "#1f5a30";
          x.fillRect(a, y, b - a + 1, 1);
          if (b - a > 1) {
            x.fillStyle = "#4aa850";
            x.fillRect(a + 1, y, b - a - 1, 1);
            x.fillStyle = "#86d870";
            x.fillRect(a + 1, y, Math.max(1, (b - a) >> 2), 1);
          }
        });
        x.fillStyle = "#2f8a40";
        x.fillRect(9, 9, 2, 1);
        x.fillRect(11, 11, 2, 1);
        x.fillRect(8, 6, 2, 1);
      }
      function drawRock(x) {
        const rows = [
          [3, 5, 10],
          [4, 3, 12],
          [5, 2, 13],
          [6, 2, 13],
          [7, 1, 14],
          [8, 1, 14],
          [9, 1, 14],
          [10, 1, 14],
          [11, 2, 13],
          [12, 3, 12],
          [13, 4, 11],

        x.fillStyle = "#00000030";
        x.fillRect(2, 13, 13, 2);
        rows.forEach(([y, a, b]) => {
          x.fillStyle = "#55555f";

      function drawBamboo(x) {
        [2, 7, 12].forEach((bx, i) => {
          x.fillStyle = "#2f7a2c";
          x.fillRect(bx, 0, 3, 16);
          x.fillStyle = "#78c850";
          x.fillRect(bx + 1, 0, 1, 16);
          x.fillStyle = "#2a5a20";
          x.fillRect(bx, (i * 5 + 3) % 16, 3, 1);
          x.fillRect(bx, (i * 5 + 11) % 16, 3, 1);
        });
        x.fillStyle = "#58b048";
        x.fillRect(4, 4, 3, 1);
        x.fillRect(9, 9, 3, 1);
        x.fillRect(14, 6, 2, 1);

            x.fillStyle = "#4a8ee0";

            x.fillStyle = "#86bef6";
            [
              [2, 1],
              [8, 7],

              for (let i = 0; i < 5; i++)
                x.fillRect(
                  (o + i + f * 3) % 16,
                  y + (i > 0 && i < 4 ? 0 : 1),

                  1,

            x.fillStyle = "#3a78c8";
            x.fillRect((5 + f * 4) % 12, 11, 4, 1);

        OVER["R"] = [paint(drawRock)];

            x.fillRect(bx, by, 1, 2);

            x.fillRect(bx + 2, by, 1, 2);

        OVER["f"] = variants(2, 81, (x, r) => {
          for (let i = 0; i < 2; i++) {

        zenny: CONFIG.START_ZENNY,
        hunts: 0,
        weapon: "greatsword",
        muted: false,
      });
      function loadBox() {
        try {
          return {
            ...defaultBox(),
            ...(JSON.parse(localStorage.getItem(BOX_KEY)) || {}),
          };
        } catch (e) {
          return defaultBox();
        }
      }
      function saveBox() {
        try {
          localStorage.setItem(BOX_KEY, JSON.stringify(BOX));
        } catch (e) {
          /* storage blocked */

      }
      let BOX = loadBox();
      Audio8.setMuted(BOX.muted);

      /* =====================================================================
   STEP 8 — STATE & NEW GAME (spawns straight into Base Camp)
   ===================================================================== */
      let G = null;
      const UI = { mode: "main", data: {} };
      let dirStack = [],
        menuState = null,
        mapResolve = null,
        carveResolve = null,
        storeResolve = null;
      let typing = false,
        skipType = false,
        advance = null;

      const NPC_DEFS = [
        {
          id: "campcat",
          area: 0,
          at: [9, 6],
          name: "CAMP FELYNE",
          look: "cat",
          wander: true,
        },
        {
          id: "veteran",
          area: 2,
          at: [8, 12],

        },
        {

      ];

      function makeFoe(key, d, isBoss) {
        const parts = {};
        for (const k in d.parts)
          parts[k] = { hp: d.parts[k], max: d.parts[k], broken: false };
        return {
          kind: isBoss ? "boss" : "small",
          key,
          isBoss,
          name: d.name,
          rank: d.rank,
          attacks: d.attacks,
          hp: d.hp,
          maxHp: d.hp,
          parts,
          sleeping: false,
          sleepTurns: 0,
          flash: 0,
          skipNext: null,
          atkMult: 1,
          armorCracked: false,
          trapped: 0,
          trapCount: 0,
          tranq: 0,
          turnsInArea: 0,
          roamTimer: 0,
          restTurns: 0,
          fleeAt: randInt(CONFIG.FLEE_MIN, CONFIG.FLEE_MAX),
          lowHpFled: false,
          warnedCap: false,
          roared: false,
          dead: false,
          captured: false,
          area: null,
          posArea: null,
          x: 0,
          y: 0,
          hx: 0,
          hy: 0,
          mv: null,
          next: 0,
          dir: "left",
          alerted: false,
          bang: 0,
        };
      }
      function makeNpcs() {
        return NPC_DEFS.map((d) => {
          const p = findFree(MAPS[d.area], d.at[0], d.at[1]);
          return {
            ...d,
            kind: "npc",
            x: p.x,
            y: p.y,
            hx: p.x,
            hy: p.y,
            mv: null,
            next: 0,
            dir: "down",
          };
        });
      }
      function makeSmalls(npcs) {
        const out = {};
        for (const a in SMALL_SPAWNS) {
          const M = MAPS[a],
            list = [];
          SMALL_SPAWNS[a].forEach((key) => {
            const cands = [];
            M.reach.forEach((k) => {
              const [x, y] = k.split(",").map(Number),
                c = M.tiles[y][x];
              if (M.blockers.has(k) || c === "E" || c === "-") return;
              if (
                M.exits.some((e) => Math.abs(e.x - x) + Math.abs(e.y - y) < 6)
              )
                return;
              if (Math.abs(x - 11.5) + Math.abs(y - 8.5) < 4) return;
              if (list.some((s) => Math.abs(s.hx - x) + Math.abs(s.hy - y) < 4))
                return;
              if (
                npcs.some(
                  (n) =>
                    n.area === +a &&
                    Math.abs(n.hx - x) + Math.abs(n.hy - y) < 4,
                )
              )
                return;
              cands.push({ x, y });
            });
            const p = cands.length ? pick(cands) : findFree(M, CXT + 5, CYT);
            const s = makeFoe(key, SMALLS[key], false);
            Object.assign(s, { area: +a, x: p.x, y: p.y, hx: p.x, hy: p.y });
            list.push(s);
          });
          out[a] = list;
        }
        return out;
      }

      function newGame(mk = "rathalos") {
        releaseWaits();
        const wk = WEAPONS[BOX.weapon] ? BOX.weapon : "greatsword";
        G = {
          screen: "field",
          turn: 1,
          loggedTurn: 0,
          busy: false,
          over: false,
          outcome: null,
          paint: 0,
          itemsUsed: 0,
          monsterKey: mk,
          foe: null,
          grace: 0,
          ents: [],
          inventory: {
            potion: 5,
            whetstone: 3,
            might: 1,
            paintball: 1,
            flash: 1,
            shock: 0,
            tranq: 0,
          },
          gathered: {},
          gatherUses: {},
          carves: [],
          rewards: null,
          boxed: false,
          flags: { supply: false, vetHint: false, fishTraded: false, tip: 0 },
          f: {
            area: 0,
            x: CAMP_SPAWN.x,
            y: CAMP_SPAWN.y,
            dir: "down",
            mv: null,
            step: 0,
          },
          player: {
            maxHp: CONFIG.PLAYER_MAX_HP,
