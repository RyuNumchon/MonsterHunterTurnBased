        };
        G.monster = makeFoe(mk, MONSTERS[mk], true);
        G.monster.area = pick([4, 5, 6, 7, 9]);
        G.npcs = makeNpcs();
        G.smalls = makeSmalls(G.npcs);
        ["rewardOv", "mapOv", "fDialog"].forEach((id) =>
          $(id).classList.add("hidden"),
        );
        $("trans").className = "";
        $("log").innerHTML = "";
        dirStack = [];
        miniKey = "";
        buildEntities(true);
        showScreen();
        setPhase(0);
        renderPanel();
        showLocation(0);
        Audio8.music("camp");
        flow(async () => {
          await say(
            `QUEST: Hunt the ${G.monster.name}\nin the MOUNTAIN STREAM!`,
          );
          await say(
            `Your ${WEAPONS[wk].name} is equipped. Swap weapons\nat the red ITEM BOX here in camp.`,
          );
          await say(
            "Grab supplies from the blue SUPPLY BOX,\nthen leave through a numbered exit.",
            "dim",
          );
        });
      }

      /* =====================================================================
   STEP 9 — MESSAGE ENGINE, MENUS, MAP & FLOW CONTROL
   ===================================================================== */
      async function typeText(text, cls) {
        const g = G;
        addLog(text.replace(/\n/g, " "), cls);
        let el, arrow;
        if (G.screen === "battle" && !G.over) {
          setMode("message");
          el = $("msg");
          arrow = $("arrow");
        } else {
          $("fDialog").classList.remove("hidden");
          el = $("fmsg");
          arrow = $("farrow");
        }
        arrow.classList.remove("show");
        typing = true;
        skipType = false;
        for (let i = 1; i <= text.length; i++) {
          if (skipType) {
            el.textContent = text;
            break;
          }
          el.textContent = text.slice(0, i);
          await sleep(CONFIG.TEXT_SPEED);
          if (G !== g) {
            typing = false;
            throw new Abort();
          }
        }
        typing = false;
        return arrow;
      }
      async function say(text, cls = "") {
        const g = G;
        const arrow = await typeText(text, cls);
        arrow.classList.add("show");
        await new Promise((res) => {
          let t = null;
          const done = () => {
            if (advance !== done) return;
            advance = null;
            clearTimeout(t);
            res();
          };
          advance = done;
          if (CONFIG.AUTO && G.screen === "battle")
            t = setTimeout(done, CONFIG.AUTO_ADVANCE + text.length * 8);
        });
        if (G !== g) throw new Abort();
      }
      function doAdvance() {
        if (typing) skipType = true;
        else if (advance) {
          Audio8.sfx("blip");
          advance();
        }
      }
      async function pause(ms) {
        const g = G;
        await sleep(ms);
        if (G !== g) throw new Abort();
      }

      function choose(title, opts, cfg = {}) {
        const g = G;
        const list = opts.map((o) =>
          typeof o === "string" ? { label: o } : o,
        );
        return new Promise((res) => {
          const idx = list.findIndex((o) => !o.disabled);
          menuState = {
            title,
            opts: list,
            idx: Math.max(0, idx),
            resolve: res,
            cancel: cfg.cancel !== false,
            yn: !!cfg.yn,
            desc: !!cfg.desc,
          };
          renderMenu();
        }).then((v) => {
          if (G !== g) throw new Abort();
          return v;
        });
      }
      async function ask(text) {
        await typeText(text);
        return (await choose(null, ["YES", "NO"], { yn: true })) === 0;
      }
      function renderMenu() {
        const el = $("fMenu"),
          s = menuState;
        if (!s) {
          el.className = "hidden";
          el.innerHTML = "";
          return;
        }
        el.className = s.yn ? "yn" : "";
        const cur = s.opts[s.idx];
        el.innerHTML = `<div class="menu">${s.title ? `<div class="mh">${s.title}</div>` : ""}${s.opts
          .map(
            (o, i) =>
              `<button class="mi ${i === s.idx ? "focus" : ""}" data-act="menu" data-val="${i}" ${o.disabled ? "disabled" : ""}>${o.icon ? pimg(o.icon) : ""}<span>${o.label}</span>${o.right !== undefined ? `<span class="q">${o.right}</span>` : ""}</button>`,
          )
          .join(
            "",
          )}${s.desc ? `<div class="mdesc">${(cur && cur.desc) || ""}</div>` : ""}</div>`;
      }
      function moveMenu(d) {
        const s = menuState;
        if (!s) return;
        const n = s.opts.length;
        for (let i = 1; i <= n; i++) {
          const j = (s.idx + d * i + n * 4) % n;
          if (!s.opts[j].disabled) {
            s.idx = j;
            break;
          }
        }
        Audio8.sfx("blip");
        renderMenu();
      }
      function pickMenu(i) {
        const s = menuState;
        if (!s || !s.opts[i] || s.opts[i].disabled) return;
        Audio8.sfx("select");
        menuState = null;
        renderMenu();
        s.resolve(i);
      }
      function cancelMenu() {
        const s = menuState;
        if (!s || !s.cancel) return;
        Audio8.sfx("back");
        menuState = null;
        renderMenu();
        s.resolve(-1);
      }

      function openMap() {
        const g = G;
        renderMapOv();
        $("mapOv").classList.remove("hidden");
        Audio8.sfx("select");
        return new Promise((res) => {
          mapResolve = res;
        }).then(() => {
          $("mapOv").classList.add("hidden");
          if (G !== g) throw new Abort();
        });
      }
      function closeMap() {
        if (mapResolve) {
          const r = mapResolve;
          mapResolve = null;
          Audio8.sfx("back");
          r();
        }
      }
      function doCarve() {
        if (carveResolve) {
          const r = carveResolve;
          carveResolve = null;
          r();
        }
      }
      function closeStorage() {
        if (storeResolve) {
          const r = storeResolve;
          storeResolve = null;
          r();
        }
      }

      function releaseWaits() {
        typing = false;
        if (advance) advance();
        if (menuState) {
          const s = menuState;
          menuState = null;
          renderMenu();
          s.resolve(-1);
        }
        if (mapResolve) {
          const r = mapResolve;
          mapResolve = null;
          r();
        }
        doCarve();
        closeStorage();
      }

      async function flow(fn) {
        if (!G || G.busy) return;
        const g = G;
        g.busy = true;
        let next;
        try {
          next = await fn();
        } catch (e) {
          if (e instanceof Abort) return;
          console.error(e);
        }
        if (G !== g) return;
        g.busy = false;
        $("fDialog").classList.add("hidden");
        if (G.over) {
          UI.mode = "end";
          renderPanel();
          return;
        }
        if (G.screen === "battle") setMode(next || "main");
        else renderPanel();
      }

      function showLocation(a) {
        const el = $("locPop");
        el.innerHTML = `<b>${AREAS[a].name}</b><br><small>${AREAS[a].sub}</small>`;
        el.classList.add("show");
        clearTimeout(showLocation.t);
        showLocation.t = setTimeout(() => el.classList.remove("show"), 2200);
      }
      function toast(txt) {
        const el = $("toast");
        el.textContent = txt;
        el.classList.add("show");
        clearTimeout(toast.t);
        toast.t = setTimeout(() => el.classList.remove("show"), 3500);
      }

      /* =====================================================================
   STEP 10 — FIELD ENGINE (grid movement, monster AI, encounters, areas)
   Encounters are collision-based: you walk into a monster, or it walks into you.
   ===================================================================== */
      const canAct = () =>
        !!G &&
        G.screen === "field" &&
        !G.busy &&
        !G.over &&
        !menuState &&
        !mapResolve &&
        !storeResolve;
      const tileWalk = (M, x, y) =>
        x >= 0 &&
        y >= 0 &&
        x < M.w &&
        y < M.h &&
        !SOLID.has(M.tiles[y][x]) &&
        !M.blockers.has(x + "," + y);
      function entAt(x, y, except) {
        return G.ents.find(
          (e) =>
            e !== except &&
            !e.dead &&
            ((e.x === x && e.y === y) ||
              (e.mv && e.mv.tx === x && e.mv.ty === y)),
        );
      }
      function playerOn(x, y) {
        const f = G.f;
        return (
          (f.x === x && f.y === y) || (!!f.mv && f.mv.tx === x && f.mv.ty === y)
        );
      }
      function entFree(x, y, self) {
        const M = MAPS[G.f.area];
        return (
          tileWalk(M, x, y) &&
          M.tiles[y][x] !== "E" &&
          !entAt(x, y, self) &&
          !playerOn(x, y)
        );
      }
      function beginMove(e, tx, ty, dur) {
        e.mv = { tx, ty, t: 0, dur };
      }

      function buildEntities(reset) {
        const a = G.f.area,
          M = MAPS[a],
          list = [],
          now = performance.now();
        G.npcs
          .filter((n) => n.area === a)
          .forEach((n) => {
            if (reset) {
              n.x = n.hx;
              n.y = n.hy;
              n.mv = null;
            }
            n.next = now + 1000;
            list.push(n);
          });
        (G.smalls[a] || [])
          .filter((s) => !s.dead)
          .forEach((s) => {
            if (reset) {
              s.x = s.hx;
              s.y = s.hy;
              s.mv = null;
              s.alerted = false;
            }
            s.next = now + 800 + Math.random() * 800;
            list.push(s);
          });
        const m = G.monster;
        if (!m.dead && !m.captured && m.area === a) {
          if (reset || m.posArea !== a) {
            const p = findFree(
              M,
              11,
              8,
              (x, y) =>
                list.some((e) => Math.abs(e.x - x) + Math.abs(e.y - y) < 2),
              true,
            );
            Object.assign(m, {
              x: p.x,
              y: p.y,
              hx: p.x,
              hy: p.y,
              mv: null,
              posArea: a,
              alerted: false,
              turnsInArea: 0,
            });
            m.next = now + 1500;
          }
          list.push(m);
        }
        G.ents = list;
      }
      function refreshEntities() {
        G.ents = G.ents.filter(
          (e) =>
            !e.dead &&
            !(e.kind === "boss" && (e.area !== G.f.area || e.captured)),
        );
      }

      function updateField(dt, now) {
        if (!canAct()) return;
        const f = G.f;
        if (f.mv) {
          f.mv.t += dt / CONFIG.MOVE_MS;
          if (f.mv.t >= 1) {
            f.x = f.mv.tx;
            f.y = f.mv.ty;
            f.mv = null;
            if (onPlayerStep()) return;
          }
        }
        if (!f.mv) {
          const d = dirStack[dirStack.length - 1];
          if (d) {
            f.dir = d;
            const [dx, dy] = DIRV[d],
              tx = f.x + dx,
              ty = f.y + dy,
              e = entAt(tx, ty);
            if (e) {
              if (e.kind !== "npc") {
                startEncounter(
                  e,
                  e.kind === "boss" && e.sleeping ? "sneak" : "engage",
                );
                return;
              }
            } else if (tileWalk(MAPS[f.area], tx, ty)) {
              f.mv = { tx, ty, t: 0 };
              f.step++;
            }
          }
        }
        for (const e of G.ents) {
          if (G.busy) return;
          if (e.mv) {
            e.mv.t += dt / e.mv.dur;
            if (e.mv.t >= 1) {
              e.x = e.mv.tx;
              e.y = e.mv.ty;
              e.mv = null;
            }
          } else if (now >= e.next) aiStep(e, now);
        }
      }
      function onPlayerStep() {
        const f = G.f,
          M = MAPS[f.area];
        if (M.tiles[f.y][f.x] === "E") {
          const ex = M.exits.find((e) => e.x === f.x && e.y === f.y);
          if (ex) {
            changeArea(ex.to);
            return true;
          }
        }
        return false;
      }

      /* Monster AI: within aggro range it shows "!", then CHASES at 95 ms/tile (boss) or
   115 ms/tile (small), faster than the hunter's 150 ms/tile. Touching = AMBUSH. */
      function aiStep(e, now) {
        const f = G.f;
        if (e.kind === "npc") {
          if (e.wander && Math.random() < 0.5) {
            const [dn, [sx, sy]] = pick(Object.entries(DIRV)),
              tx = e.x + sx,
              ty = e.y + sy;
            e.dir = dn;
            if (
              Math.abs(tx - e.hx) <= 1 &&
              Math.abs(ty - e.hy) <= 1 &&
              entFree(tx, ty, e)
            )
              beginMove(e, tx, ty, 380);
          } else e.dir = pick(["down", "left", "right", "up"]);
          e.next = now + rand(1200, 2600);
          return;
        }
        if (e.kind === "boss" && e.sleeping) {
          e.next = now + 800;
          return;
        }
        const aggro =
          e.kind === "boss" ? CONFIG.BOSS_AGGRO : SMALLS[e.key].aggro;
        const d = Math.abs(e.x - f.x) + Math.abs(e.y - f.y);
        if (now >= G.grace && d <= aggro) {
          if (!e.alerted) {
            e.alerted = true;
            e.bang = now + 600;
            e.next = now + 450;
            Audio8.sfx(e.kind === "boss" ? "roar" : "bang");
            return;
          }
          const ddx = f.x - e.x,
            ddy = f.y - e.y,
            opts = [];
          if (Math.abs(ddx) >= Math.abs(ddy)) {
            if (ddx) opts.push([Math.sign(ddx), 0]);
            if (ddy) opts.push([0, Math.sign(ddy)]);
          } else {
            if (ddy) opts.push([0, Math.sign(ddy)]);
            if (ddx) opts.push([Math.sign(ddx), 0]);
          }
          const dur =
            e.kind === "boss" ? CONFIG.BOSS_CHASE_MS : CONFIG.SMALL_CHASE_MS;
          let moved = false;
          for (const [sx, sy] of opts) {
            const tx = e.x + sx,
              ty = e.y + sy;
            if (sx) e.dir = dirOf(sx, sy);
            if (playerOn(tx, ty)) {
              startEncounter(e, "ambush");
              return;
            }
            if (entFree(tx, ty, e)) {
              beginMove(e, tx, ty, dur);
              moved = true;
              break;
            }
          }
          e.next = now + (moved ? dur : 200);
          return;
        }
        e.alerted = false;
        if (Math.random() < 0.55) {
          const [dn, [sx, sy]] = pick(Object.entries(DIRV)),
            tx = e.x + sx,
            ty = e.y + sy,
            rad = e.kind === "boss" ? 4 : 3;
          if (sx) e.dir = dn;
          if (
            Math.abs(tx - e.hx) <= rad &&
            Math.abs(ty - e.hy) <= rad &&
            entFree(tx, ty, e)
          )
            beginMove(e, tx, ty, CONFIG.WANDER_MS);
        }
        e.next = now + rand(800, 1800);
      }

      function spawnFor(to, from) {
        const ex = MAPS[to].exits.find((e) => e.to === from);
        return ex
          ? { x: ex.x + ex.ix, y: ex.y + ex.iy, dir: ex.idir }
          : { ...CAMP_SPAWN };
      }
      function changeArea(to) {
        flow(async () => {
          const tr = $("trans");
          Audio8.sfx("area");
          tr.className = "fadeIn";
          await pause(260);
          const from = G.f.area,
            sp = spawnFor(to, from);
          Object.assign(G.f, {
            area: to,
            x: sp.x,
            y: sp.y,
            dir: sp.dir,
            mv: null,
          });
          const msgs = worldTick();
          buildEntities(true);
          G.grace = performance.now() + 1200;
          Audio8.music(fieldMusic());
          tr.className = "fadeOut";
          showLocation(to);
          await pause(260);
          tr.className = "";
          if (msgs.length) toast(msgs.join("\n"));
        });
      }

      /* World turn: while you are elsewhere the big monster heals 3%/turn, may fall asleep
   below 60% HP (80% in the NEST), wakes after 6 turns or at 70% HP, and roams. */
      function worldTick() {
        const msgs = [],
          p = G.player,
          m = G.monster;
        G.turn++;
        if (G.paint > 0 && --G.paint === 0)
          msgs.push("The paintball scent faded...");
        if (p.buffs.might > 0 && --p.buffs.might === 0)
          msgs.push("The MIGHT SEED wore off.");
        if (m.dead || m.captured || m.area === G.f.area) return msgs;
        m.restTurns++;
        m.hp = Math.min(
          m.maxHp,
          m.hp + Math.round(m.maxHp * CONFIG.REST_HEAL_PCT),
        );
        if (m.sleeping) {
          m.sleepTurns++;
          if (m.sleepTurns >= CONFIG.WAKE_AFTER || m.hp / m.maxHp >= 0.7) {
            m.sleeping = false;
            if (G.paint > 0) msgs.push(`The ${m.name} woke up.`);
          }
        } else if (
          m.restTurns >= 2 &&
          m.hp / m.maxHp < 0.6 &&
          Math.random() <
            (m.area === NEST ? CONFIG.NEST_SLEEP_CHANCE : CONFIG.SLEEP_CHANCE)
        ) {
          m.sleeping = true;
          m.sleepTurns = 0;
          if (G.paint > 0)
            msgs.push(
              `PAINTBALL: the ${m.name} fell ASLEEP in AREA ${m.area}!`,
            );
        }
        if (
          !m.sleeping &&
          ++m.roamTimer >= m.fleeAt &&
          Math.random() < CONFIG.ROAM_CHANCE
        ) {
          m.area = pick(neighbors(m.area).filter((a) => a !== 0));
          m.roamTimer = 0;
          m.restTurns = 0;
          m.posArea = null;
          m.fleeAt = randInt(CONFIG.FLEE_MIN, CONFIG.FLEE_MAX);
          msgs.push(
            G.paint > 0
              ? `PAINTBALL: the ${m.name} moved to AREA ${m.area}.`
              : "You hear a distant roar...",
          );
        }
        return msgs;
      }

      /* =====================================================================
   STEP 11 — FIELD INTERACTIONS (NPCs, Item Box, Supply Box, gathering, menus)
   ===================================================================== */
      function interact() {
        const f = G.f,
          [dx, dy] = DIRV[f.dir],
          tx = f.x + dx,
          ty = f.y + dy,
          M = MAPS[f.area];
        const e = entAt(tx, ty);
        if (e) {
          if (e.kind === "npc") {
            e.dir = OPP[f.dir];
            Audio8.sfx("blip");
            flow(() => NPC_TALK[e.id](e));
          } else
            startEncounter(
              e,
              e.kind === "boss" && e.sleeping ? "sneak" : "engage",
            );
          return;
        }
        const obj = M.objects.find(
          (o) => tx >= o.x && tx < o.x + o.w && ty >= o.y && ty < o.y + o.h,
        );
        if (obj) {
          Audio8.sfx("blip");
          flow(() => useObject(obj));
          return;
        }
        const gp = M.gathers.find((g) => g.x === tx && g.y === ty);
        if (gp) {
          flow(() => gatherAt(gp));
          return;
        }
        const c = M.tiles[ty] && M.tiles[ty][tx];
        if (c === "~" || c === "w")
          flow(async () => {
            await say("The mountain water is clear and cold.");
          });
      }
      const addGathered = (name) => {
        G.gathered[name] = (G.gathered[name] || 0) + 1;
      };

      async function gatherAt(gp) {
        const key = `${G.f.area},${gp.x},${gp.y}`,
          used = G.gatherUses[key] || 0,
          def = GATHER[gp.type];
        if (used >= CONFIG.GATHER_USES) {
          await say(`This ${def.label} spot is exhausted.`, "dim");
          return;
        }
        G.gatherUses[key] = used + 1;
        Audio8.sfx("carve");
        await say(def.verb);
        const r = weighted(def.loot);
        Audio8.sfx("gather");
        if (r.name.startsWith("@")) {
          const k = r.name.slice(1);
          G.inventory[k] = (G.inventory[k] || 0) + 1;
          await say(
            `HUNTER found a ${ITEMS[k].name}!\nIt was put in the BAG. (x${G.inventory[k]})`,
            "good",
          );
        } else {
          addGathered(r.name);
          await say(
            `HUNTER obtained ${r.name}!\n(${CONFIG.GATHER_USES - used - 1} more gathers here)`,
            "good",
          );
        }
      }
      function signText(a) {
        const ex = MAPS[a].exits
          .map((e) => `${e.side}: ${e.to === 0 ? "CAMP" : "AREA " + e.to}`)
          .join(" · ");
        return `MOUNTAIN STREAM · ${AREAS[a].name}\nEXITS  ${ex}`;
      }

      async function useObject(o) {
        const p = G.player;
        switch (o.type) {
          case "box":
            if (G.flags.supply) {
              await say("The blue SUPPLY BOX is empty.", "dim");
              return;
            }
            G.flags.supply = true;
            {
              const sup = {
                potion: 3,
                paintball: 2,
                shock: 1,
                tranq: 2,
                flash: 1,
              };
              for (const k in sup) G.inventory[k] += sup[k];
            }
            Audio8.sfx("item");
            await say("HUNTER opened the blue SUPPLY BOX!");
            await say(
              "Got POTION x3, PAINTBALL x2, FLASH BOMB x1,\nSHOCK TRAP x1 and TRANQ BOMB x2!",
              "good",
            );
            return;
          case "itembox":
            await itemBoxMenu();
            return;
          case "bed":
            if (
              !(await ask(
                "Rest in the bed?\n(Restores all HP. 1 turn passes.)",
              ))
            )
              return;
            {
              const tr = $("trans");
              tr.className = "fadeIn";
              await pause(400);
              p.hp = p.maxHp;
              const msgs = worldTick();
              tr.className = "fadeOut";
              await pause(300);
              tr.className = "";
              Audio8.sfx("heal");
              await say(
                "HUNTER took a short nap...\nHP was fully restored!",
                "good",
              );
              if (msgs.length) toast(msgs.join("\n"));
            }
            return;
          case "tent":
            await say("The Guild's tent. Your BED is right beside it.");
            return;
          case "sign":
            await say(signText(G.f.area));
            return;
        }
      }

      // ITEM BOX: weapon select (saved) + view stored loot
      async function itemBoxMenu() {
        Audio8.sfx("item");
        await say("HUNTER opened the ITEM BOX.");
        while (true) {
          const p = G.player;
          const i = await choose("ITEM BOX", [
            {
              icon: DATA["wpn_" + p.weapon],
              label: "CHANGE WEAPON",
              right: WEAPONS[p.weapon].short,
            },
            {
              icon: DATA["item_potion"],
              label: "VIEW STORAGE",
              right: Object.keys(BOX.items).length,
            },
            { label: "CLOSE" },
          ]);
          if (i === 0) {
            const keys = Object.keys(WEAPONS);
            const j = await choose(
              "EQUIP WEAPON",
              keys.map((k) => ({
                icon: DATA["wpn_" + k],
                label: WEAPONS[k].name,
                right: k === p.weapon ? "E" : "",
                desc: WEAPONS[k].blurb,
              })),
              { desc: true },
            );
            if (j < 0) continue;
            const k = keys[j];
            if (k === p.weapon) {
              await say("That weapon is already equipped.", "dim");
              continue;
            }
            Object.assign(p, { weapon: k, charge: 0, spirit: 0 });
            BOX.weapon = k;
            saveBox();
            Audio8.sfx("sharpen");
            await say(`HUNTER equipped the ${WEAPONS[k].name}!`, "good");
          } else if (i === 1) await showStorage();
          else return;
        }
      }
      function showStorage() {
        const g = G;
        renderStorage();
        $("rewardOv").classList.remove("hidden");
        return new Promise((res) => {
          storeResolve = res;
        }).then(() => {
          $("rewardOv").classList.add("hidden");
          if (G !== g) throw new Abort();
        });
      }
      function renderStorage() {
        const items = Object.entries(BOX.items).sort(
          (a, b) =>
            (ITEM_RAR[b[0]] || 1) - (ITEM_RAR[a[0]] || 1) ||
            a[0].localeCompare(b[0]),
        );
        $("rewardOv").innerHTML = `
    <div class="rhead"><h3>ITEM BOX</h3><span>WALLET ${BOX.zenny}z · HUNTS CLEARED ${BOX.hunts}</span></div>
    <div class="rbody">${
      items.length
        ? `<div class="rgrid">${items.map(([n, c], i) => slotHtml(n, ITEM_RAR[n] || 1, c, i * 0.03)).join("")}</div>`
        : '<p class="ftxt">The box is empty. Go hunt something!</p>'
    }</div>
    <div class="rbtns"><button class="rbtn" data-act="closebox">CLOSE</button><button class="rbtn alt" data-act="wipebox">RESET SAVE</button></div>`;
      }

      /* ---------- NPC conversations ---------- */
      const TIPS = [
        "Walk into a monster to start a battle.\nThey run faster than you, so plan ahead!",
        "Hit the big monster with a PAINTBALL.\nThen the MAP shows where it goes, nya!",
        "Weak monsters limp to the WYVERN NEST\n(AREA 8) to sleep. Sneak attacks deal x2!",
        "To CAPTURE: get it under 25% HP,\nset a SHOCK TRAP, then throw 2 TRANQ BOMBs!",
        "Captures can't be carved, meow...\nbut the Guild pays bigger rewards!",
        "RED sharpness makes your blade BOUNCE.\nUse a WHETSTONE before that happens!",
      ];
      async function talkCampCat() {
        await say(
          "CAMP FELYNE: Meow! Welcome to the\nMOUNTAIN STREAM, hunter-nyan!",
        );
        while (true) {
          const c = await choose("CAMP FELYNE", [
            { label: "ADVICE" },
            { label: "SHOP", right: BOX.zenny + "z" },
            { label: "BYE" },
          ]);
          if (c === 0) await say(TIPS[G.flags.tip++ % TIPS.length]);
          else if (c === 1) await shop();
          else {
            await say("Good hunting, meow!");
            return;
          }
        }
      }
      async function shop() {
        const keys = Object.keys(ITEMS);
        while (true) {
          const opts = keys.map((k) => ({
            icon: DATA["item_" + k],
            label: ITEMS[k].name,
            right: ITEMS[k].price + "z",
            desc: `${ITEMS[k].desc} (You have ${G.inventory[k]})`,
          }));
          opts.push({ label: "DONE", desc: "Leave the shop." });
          const i = await choose(`SHOP · WALLET ${BOX.zenny}z`, opts, {
            desc: true,
          });
          if (i < 0 || i === keys.length) return;
          const k = keys[i],
            it = ITEMS[k];
          if (BOX.zenny < it.price) {
            await say(
              `Meow... that costs ${it.price}z.\nYou only have ${BOX.zenny}z.`,
              "bad",
            );
            continue;
          }
          if (await ask(`Buy a ${it.name} for ${it.price}z?`)) {
            BOX.zenny -= it.price;
            saveBox();
            G.inventory[k]++;
            Audio8.sfx("buy");
            await say(`Thank you, nya! You got a ${it.name}.`, "good");
          }
        }
      }
      async function talkVeteran() {
        const m = G.monster;
        if (m.dead || m.captured) {
          await say("VETERAN: Ha! You actually did it.\nNot bad, rookie.");
          return;
        }
        if (!G.flags.vetHint) {
          await say(
            `VETERAN: Hunting the ${m.name}, eh?\nI've been tracking it all morning.`,
          );
          if (await ask("Want to know where I last saw it?")) {
            G.flags.vetHint = true;
            G.paint = Math.max(G.paint, 4);
            Audio8.sfx("item");
            await say(
              `It was heading for AREA ${m.area}.\nI marked it on your MAP. (4 turns)`,
              "good",
            );
          } else
            await say(
              "Suit yourself. The MOUNTAIN STREAM\nis a big place, rookie.",
            );
        } else
          await say(
            pick([
              "Break the TAIL to weaken its attacks.\nBreak the LEGS and it trips over.",
              "Aim for the HEAD: big damage...\nbut it is hard to hit. Misses DRIFT.",
              "A FLASH BOMB halves its accuracy.\nGreat for setting up a full charge.",
            ]),
          );
      }
      async function talkComrade() {
        if (G.flags.fishTraded) {
          await say(
            "FELYNE: Purr... that SUSHIFISH was\ndelicious. Good luck, nya!",
          );
          return;
        }
        await say(
          "FELYNE: Mrrrow... I'm sooo hungry...\nI'd trade ANYTHING for a SUSHIFISH.",
        );
        if ((G.gathered.SUSHIFISH || 0) > 0) {
          if (await ask("Give the FELYNE a SUSHIFISH?")) {
            if (--G.gathered.SUSHIFISH <= 0) delete G.gathered.SUSHIFISH;
            G.inventory.shock++;
            G.flags.fishTraded = true;
            Audio8.sfx("capture");
            await say(
              "FELYNE: Nyaaa! Thank you!\nTake my SHOCK TRAP, nya!",
              "good",
            );
            await say("HUNTER received a SHOCK TRAP!", "good");
          } else await say("FELYNE: ...*stomach growls loudly*");
        } else
          await say(
            "Fish at the river in AREA 6\nor the waterfall in AREA 7, nya!",
            "dim",
          );
      }
      const NPC_TALK = {
        campcat: talkCampCat,
        veteran: talkVeteran,
        comrade: talkComrade,
      };

      function openStartMenu() {
        Audio8.sfx("select");
        flow(async () => {
          while (true) {
            $("fDialog").classList.add("hidden");
            const i = await choose("MENU", [
              "BAG",
              "MAP",
              "HUNTER",
              "QUEST",
              "ABANDON QUEST",
              "EXIT",
            ]);
            const p = G.player,
              m = G.monster,
              s = getSharp(p.sharp);
            if (i === 0) await fieldBag();
            else if (i === 1) await openMap();
            else if (i === 2)
              await say(
                `HUNTER · ${WEAPONS[p.weapon].name}\nHP ${p.hp}/${p.maxHp} · EDGE ${s.name} · CARTS ${p.carts}/${CONFIG.MAX_CARTS}`,
              );
            else if (i === 3)
              await say(
                `QUEST: Slay or capture the ${m.name}.\nTURN ${G.turn} · PAINTBALL ${G.paint > 0 ? G.paint + " turns" : "none"}`,
              );
            else if (i === 4) {
              if (
                await ask(
                  "Abandon the quest?\nAll monster rewards will be lost.",
                )
              ) {
                finishQuest("abandon");
                return;
              }
            } else return;
          }
        });
      }
      async function fieldBag() {
        const keys = Object.keys(ITEMS);
        while (true) {
          const opts = keys.map((k) => ({
            icon: DATA["item_" + k],
            label: ITEMS[k].name,
            right: "x" + G.inventory[k],
            disabled: G.inventory[k] <= 0,
            desc: ITEMS[k].desc,
          }));
          opts.push({ label: "CLOSE", desc: "" });
          const i = await choose("BAG", opts, { desc: true });
          if (i < 0 || i === keys.length) return;
          const k = keys[i],
            p = G.player;
          if (!ITEMS[k].field) {
            await say(
              `There's no target here.\nUse the ${ITEMS[k].name} in battle!`,
              "dim",
            );
            continue;
          }
          if (k === "potion" && p.hp >= p.maxHp) {
            await say("It won't have any effect.", "dim");
            continue;
          }
          if (k === "whetstone" && p.sharp >= CONFIG.SHARP_MAX) {
            await say("Your blade is already sharp.", "dim");
            continue;
          }
          G.inventory[k]--;
          if (k === "potion") {
            const b = p.hp;
            p.hp = Math.min(p.maxHp, p.hp + 30);
            Audio8.sfx("heal");
            await say(
              `HUNTER used a POTION.\nHP was restored by ${p.hp - b}.`,
              "good",
            );
          }
          if (k === "whetstone") {
            p.sharp = CONFIG.SHARP_MAX;
            Audio8.sfx("sharpen");
            await say(
              "HUNTER sharpened the blade.\nEDGE is back to GREEN!",
              "good",
            );
          }
          if (k === "might") {
            p.buffs.might = 3;
            Audio8.sfx("item");
            await say(
              "HUNTER ate a MIGHT SEED!\nATTACK +25% for 3 turns.",
              "good",
            );
          }
        }
      }

      /* =====================================================================
   STEP 12 — BATTLE START & ITEM PHASE (instant use, max 3 per turn)
   ===================================================================== */
      function startEncounter(e, how) {
        if (!G || G.busy || G.screen !== "field" || G.over) return;
        G.f.mv = null;
        dirStack = [];
        e.mv = null;
        e.alerted = false;
        e.bang = 0;
        flow(async () => {
          G.foe = e;
          G.itemsUsed = 0;
          e.skipNext = null;
          e.trapped = 0;
          e.flash = 0;
          Audio8.sfx("encounter");
          Audio8.music(e.isBoss ? "boss" : "battle");
          const tr = $("trans");
          tr.className = "";
          void tr.offsetWidth;
          tr.className = "battle";
          await pause(1000);
          G.screen = "battle";
          $("battle").style.backgroundImage =
            `url(${battleBg(AREAS[G.f.area].theme)})`;
          $("enemySprite").className = "sprite";
          $("playerSprite").className = "sprite";
          $("enemySprite").querySelector("img").src = DATA["mb_" + e.key];
          $("playerSprite").querySelector("img").src =
            DATA["hb_" + G.player.weapon];
          showScreen();
          renderBattle();
          anim($("enemySprite"), "a-enter", 500);
          anim($("playerSprite"), "a-enterL", 500);
          tr.className = "fadeOut";
          await pause(260);
          tr.className = "";
          const n = e.name;
          if (how === "sneak")
            await say(
              `You crept up on the sleeping ${n}!\nYour first hit deals x2 WAKE-UP damage!`,
              "good",
            );
          else if (how === "ambush")
            await say(
              e.isBoss
                ? `The ${n} charged straight into you!`
                : `A wild ${n} attacked!`,
              "warn",
            );
          else
            await say(
              e.isBoss ? `You engaged the ${n}!` : `You attacked a wild ${n}!`,
            );
          if (e.isBoss && !e.roared && !e.sleeping) {
            e.roared = true;
            anim($("enemySprite"), "a-shake", 400);
            Audio8.sfx("roar");
            await say(`The ${n} let out a mighty ROAR!`, "warn");
          }
          return "main";
        });
      }

      function useItemBattle(key) {
        if (
          !G ||
          G.itemsUsed >= CONFIG.MAX_ITEMS_PER_TURN ||
          G.inventory[key] <= 0
        )
          return;
        flow(async () => {
          const p = G.player,
            m = G.foe,
            it = ITEMS[key];
          let why = null;
          if (key === "potion" && p.hp >= p.maxHp)
            why = "It won't have any effect.";
          else if (key === "whetstone" && p.sharp >= CONFIG.SHARP_MAX)
            why = "Your blade is already sharp.";
          else if (["paintball", "shock", "tranq"].includes(key) && !m.isBoss)
            why = `That won't work on a small monster\nlike the ${m.name}.`;
          else if (key === "shock" && m.trapped > 0)
            why = `The ${m.name} is already trapped!`;
          else if (key === "shock" && m.sleeping)
            why =
              "It's asleep... the trap won't trigger.\n(Asleep AND weak? Use TRANQ BOMBs!)";
          if (why) {
            await say(why, "dim");
            return "bag";
          }

          G.inventory[key]--;
          G.itemsUsed++;
          Audio8.sfx("item");
          await say(`HUNTER used a ${it.name}!`);
          switch (key) {
            case "potion": {
              const before = p.hp;
              p.hp = Math.min(p.maxHp, p.hp + 30);
              Audio8.sfx("heal");
              pop($("playerSprite"), `+${p.hp - before}`, "heal");
              renderBattle();
              await say(
                `HUNTER's HP was restored by ${p.hp - before}.`,
                "good",
              );
              break;
            }
            case "whetstone":
              p.sharp = CONFIG.SHARP_MAX;
              Audio8.sfx("sharpen");
              renderBattle();
              await say(
                "The blade is razor-sharp again!\n(EDGE: GREEN)",
                "good",
              );
              break;
            case "paintball":
              G.paint = 8;
              renderBattle();
              await say(
                `The ${m.name} was marked!\nThe MAP will track it for 8 turns.`,
                "good",
              );
              break;
            case "flash":
              m.flash = 2;
              Audio8.sfx("flash");
              anim($("flashFx"), "flashing", 700);
              renderBattle();
              await say(
                `The ${m.name} is blinded!\nIts accuracy fell sharply! (60% -> 30%)`,
                "good",
              );
              break;
            case "might":
              p.buffs.might = 3;
              renderBattle();
              await say(
                "HUNTER's ATTACK rose!\n(+25% damage for 3 turns)",
                "good",
              );
              break;
            case "shock": {
              const turns =
                m.trapCount === 0
                  ? CONFIG.TRAP_TURNS_FIRST
                  : CONFIG.TRAP_TURNS_AFTER;
              m.trapCount++;
              m.trapped = turns;
              Audio8.sfx("trap");
              anim($("flashFx"), "flashing", 700);
              renderBattle();
              await say(
                `The ${m.name} stepped into the SHOCK TRAP!\nIt's paralyzed for ${turns} turns! (+25 hit)`,
                "good",
              );
              if (m.hp / m.maxHp <= CONFIG.CAPTURE_PCT)
                await say("Now! Throw TRANQ BOMBs to capture it!", "warn");
              break;
            }
            case "tranq": {
              Audio8.sfx("tranq");
              const held = m.trapped > 0 || m.sleeping,
                weak = m.hp / m.maxHp <= CONFIG.CAPTURE_PCT;
              if (!held)
                await say(
                  "The TRANQ BOMB had no effect!\nThe monster must be TRAPPED or ASLEEP.",
                  "bad",
                );
              else if (!weak)
                await say(
                  `The ${m.name} shrugged off the gas!\nWeaken it below 25% HP first.`,
                  "bad",
                );
              else {
                m.tranq++;
                renderBattle();
                if (m.tranq >= CONFIG.TRANQ_NEEDED) m.captured = true;
                else
                  await say(
                    `The ${m.name} is getting drowsy...\n(TRANQ ${m.tranq}/${CONFIG.TRANQ_NEEDED})`,
                    "good",
                  );
              }
              break;
            }
          }
          if (m.captured) {
            await captureWin();
            return;
          }
          return G.itemsUsed < CONFIG.MAX_ITEMS_PER_TURN ? "bag" : "main";
        });
      }

      /* =====================================================================
   STEP 13 — TURN CONTROLLER (strict: Action -> Hit Calc -> Monster)
   ===================================================================== */
      function runTurn(action) {
        flow(async () => {
          const m = G.foe;
          setPhase(2);
          if (action.kind === "run") {
            if (await tryEscape()) return;
          } else {
            const intent = await playerActionPhase(action);
            setPhase(3);
            if (intent) await hitCalculationPhase(intent);
            if (G.over || G.screen !== "battle") return;
            if (m.hp <= 0) {
              await foeDefeated();
              return;
            }
          }
          setPhase(4);
          await monsterActionPhase();
          if (G.over || G.screen !== "battle") return;
          await endOfTurnTicks();
          return "main";
        });
      }
      function findMove(id) {
        return G
          ? WEAPONS[G.player.weapon].moves.find((m) => m.id === id) || null
          : null;
      }
      function moveDisabled(mv) {
        const p = G.player;
        if (mv.type === "charge" && p.charge >= 2) return true;
        if ((mv.type === "counter" || mv.type === "finisher") && p.spirit < 1)
          return true;
        return false;
      }

      // PHASE 2: returns an "intent" for attacks; charge/guard resolve here
      async function playerActionPhase(action) {
        const p = G.player,
          w = WEAPONS[p.weapon],
          move = findMove(action.moveId);
        if (p.charge > 0 && move.type !== "charge" && move.type !== "release") {
          p.charge = 0;
          renderBattle();
          await say("HUNTER's held charge faded away.", "warn");
        }
        if (move.type === "charge") {
          p.charge = Math.min(2, p.charge + 1);
          Audio8.sfx("charge");
          renderBattle();
          await say(
            `HUNTER is charging the ${w.name}!\n(Lv${p.charge} held: next release ${CHARGE_MULT[p.charge]}x)`,
          );
          return null;
        }
        if (move.type === "guard") {
          p.guarding = true;
          p.sharp = Math.max(0, p.sharp - move.sharp);
          Audio8.sfx("clang");
          renderBattle();
          await say("HUNTER raised the blade to GUARD!");
          return null;
        }
        const sharpLv = getSharp(p.sharp);
        p.sharp = Math.max(0, p.sharp - move.sharp);
        let chargeMult = 1,
          label = move.name;
        if (move.type === "release") {
          chargeMult = CHARGE_MULT[p.charge];
          label = `${move.name} Lv${p.charge + 1}`;
          p.charge = 0;
        }
        if (move.type === "finisher") {
          chargeMult = 1 + 0.5 * p.spirit;
          p.spirit = 0;
        }
        if (move.type === "counter") {
          p.foresight = true;
          p.spirit = Math.max(0, p.spirit - 1);
        }
        if (move.spirit) p.spirit = Math.min(3, p.spirit + move.spirit);
        renderBattle();
        anim($("playerSprite"), "a-lunge", 350);
        Audio8.sfx("swoosh");
        await say(`HUNTER used ${label}!`);
        return {
          move,
          label,
          power: move.power,
          chargeMult,
          sharpLv,
          target: action.target,
        };
      }

      /* PHASE 3 — HIT CALCULATION
   acc = move.acc + sharp.hit + (trapped ? 25 : 0)
   PartHit = clamp(part.baseHit + acc, 5, 98);  Overall = max(PartHit, clamp(90 + acc, 5, 99))
   Roll R: R < PartHit = clean hit | R < Overall = DRIFT to adjacent part | else miss
   DAMAGE = power × partMult × sharpMult × might × charge × wake × crack × variance(0.9–1.1) */
      function hitChances(move, partKey, sharpLv = getSharp(G.player.sharp)) {
        const m = G.foe;
        const acc =
          (move.acc || 0) +
          sharpLv.hit +
          (m && m.trapped > 0 ? CONFIG.TRAP_HIT_BONUS : 0);
        const target = clamp(PARTS[partKey].baseHit + acc, 5, 98);
        return {
          target,
          overall: Math.max(target, clamp(CONFIG.OVERALL_HIT + acc, 5, 99)),
        };
      }
      async function hitCalculationPhase(intent) {
        const p = G.player,
          m = G.foe,
          { target, sharpLv } = intent,
          wake = m.sleeping;
        let hitPart = null,
          drifted = false;
        if (wake) {
          hitPart = target;
          addLog("[sleeping target: guaranteed hit]", "dim");
        } else {
          const c = hitChances(intent.move, target, sharpLv),
            roll = Math.random() * 100;
          addLog(
            `[roll ${roll.toFixed(1)} | ${PARTS[target].label} <${c.target} | drift <${c.overall} | miss >=${c.overall}]`,
            "dim",
          );
          if (roll < c.target) hitPart = target;
          else if (roll < c.overall) {
            hitPart = pick(PARTS[target].drift);
            drifted = true;
          }
        }
        if (!hitPart) {
          Audio8.sfx("miss");
          await say("HUNTER's attack missed!", "bad");
          return;
        }
        if (drifted)
          await say(
            `The swing drifted off the ${PARTS[target].label}...\nand struck the ${PARTS[hitPart].label}!`,
            "warn",
          );

        const part = m.parts[hitPart],
          pdef = PARTS[hitPart];
        const mightM = p.buffs.might > 0 ? CONFIG.MIGHT_MULT : 1,
          wakeM = wake ? CONFIG.WAKE_MULT : 1;
        const crackM = m.armorCracked ? CONFIG.BODY_CRACK_MULT : 1,
          variance = rand(0.9, 1.1);
        const dmg = Math.max(
          1,
          Math.round(
            intent.power *
              pdef.dmgMult *
              sharpLv.dmg *
              mightM *
              intent.chargeMult *
              wakeM *
              crackM *
              variance,
          ),
        );
        addLog(
          `[DMG ${intent.power} x part ${pdef.dmgMult} x sharp ${sharpLv.dmg} x might ${mightM} x charge ${intent.chargeMult} x wake ${wakeM} x crack ${crackM} x var ${variance.toFixed(2)} = ${dmg}]`,
          "dim",
        );
        m.hp = Math.max(0, m.hp - dmg);
        part.hp = Math.max(0, part.hp - dmg);
        const big =
          wake || intent.chargeMult >= 2 || (hitPart === "head" && !drifted);
        Audio8.sfx(sharpLv.bounce ? "clang" : big ? "crit" : "hit");
        anim($("enemySprite"), "a-hit", 500);
        pop($("enemySprite"), `-${dmg}`);
        renderBattle();
        await say(`The ${m.name}'s ${pdef.label} took ${dmg} damage!`);
        if (wake) await say("A WAKE-UP BLOW! Damage x2!", "good");
        else if (hitPart === "head" && !drifted)
          await say("It hit a weak spot!", "good");
        if (intent.chargeMult >= 3)
          await say(`A full-power charge! x${intent.chargeMult}!`, "good");
        if (sharpLv.bounce) {
          const recoil = Math.round(p.maxHp * CONFIG.BOUNCE_RECOIL_PCT);
          p.hp = Math.max(m.hp <= 0 ? 1 : 0, p.hp - recoil);
          anim($("playerSprite"), "a-shake", 400);
          pop($("playerSprite"), `-${recoil}`);
          renderBattle();
          await say(
            `The dull blade BOUNCED off!\nHalf damage, and ${recoil} recoil to HUNTER!`,
            "bad",
          );
        }
        if (wake && m.hp > 0) {
          m.sleeping = false;
          renderBattle();
          Audio8.sfx("roar");
          await say(`The ${m.name} woke up in a rage!`, "warn");
        }
        if (m.isBoss && !part.broken && part.hp <= 0) {
          part.broken = true;
          await applyBreak(hitPart);
        }
        if (
          m.isBoss &&
          m.hp > 0 &&
          m.hp / m.maxHp <= CONFIG.CAPTURE_PCT &&
          !m.warnedCap
        ) {
          m.warnedCap = true;
          renderBattle();
          await say(
            `The ${m.name} looks exhausted...\nIt can be CAPTURED now!`,
            "warn",
          );
        }
        if (m.hp > 0) await checkFaint();
      }
      async function applyBreak(k) {
        const m = G.foe;
        Audio8.sfx("breakp");
        anim($("enemySprite"), "a-shake", 400);
        renderBattle();
        switch (k) {
          case "head":
            m.skipNext = "is reeling from its broken head";
            await say(
              `The ${m.name}'s HEAD was broken!\nIt's staggered!`,
              "good",
            );
            break;
          case "body":
            m.armorCracked = true;
            await say(
              `The ${m.name}'s armor CRACKED!\nAll damage +10%!`,
              "good",
            );
            break;
          case "legs":
            m.skipNext = "tripped over its broken legs";
            await say(
              `The ${m.name}'s LEGS were broken!\nIt's about to trip!`,
              "good",
            );
            break;
          case "tail":
            m.atkMult *= CONFIG.TAIL_ATK_MULT;
            await say(
              `The ${m.name}'s TAIL was severed!\nIts ATTACK fell! (x${m.atkMult.toFixed(2)})`,
              "good",
            );
            break;
        }
        renderBattle();
      }

      /* PHASE 4 — MONSTER AI: trapped -> asleep -> stunned -> flee (big only) -> attack
   Monster DMG = power × atkMult (tail) × variance × (guard ? 0.4 : 1) */
      async function monsterActionPhase() {
        const m = G.foe,
          p = G.player;
        if (m.trapped > 0) {
          m.trapped--;
          renderBattle();
          Audio8.sfx("trap");
          await say(
            `The ${m.name} is stuck in the SHOCK TRAP!${m.trapped > 0 ? `\n(${m.trapped} turn${m.trapped > 1 ? "s" : ""} left)` : ""}`,
            "good",
          );
          if (m.trapped === 0) {
            renderBattle();
            await say(`The ${m.name} broke free of the trap!`, "warn");
          }
          return;
        }
        if (m.sleeping) {
          await say(`The ${m.name} is fast asleep.`, "dim");
          return;
        }
        m.turnsInArea++;
        if (m.skipNext) {
          const why = m.skipNext;
          m.skipNext = null;
          renderBattle();
          await say(`The ${m.name} ${why}\nand can't move!`, "good");
          return;
        }
        if (m.isBoss) {
          if (
            m.hp / m.maxHp < CONFIG.LOW_HP_FLEE &&
            !m.lowHpFled &&
            Math.random() < CONFIG.LOW_HP_FLEE_CHANCE
          ) {
            m.lowHpFled = true;
            await monsterFlee(true);
            return;
          }
          if (m.turnsInArea >= m.fleeAt && Math.random() < CONFIG.FLEE_CHANCE) {
            await monsterFlee(false);
            return;
          }
        }
        const atk = pick(m.attacks);
        anim($("enemySprite"), "a-elunge", 350);
        Audio8.sfx("swoosh");
        await say(`The ${m.name} used ${atk.name}!`);
        if (p.foresight) {
          Audio8.sfx("miss");
          await say("HUNTER's FORESIGHT SLASH evaded it!", "good");
          return;
        }
        const hitChance =
            m.flash > 0 ? CONFIG.MONSTER_HIT_FLASHED : CONFIG.MONSTER_HIT,
          roll = Math.random() * 100;
        addLog(`[monster roll ${roll.toFixed(1)} vs ${hitChance}%]`, "dim");
        if (roll >= hitChance) {
          Audio8.sfx("miss");
          await say(
            m.flash > 0
              ? `The blinded ${m.name} missed wildly!`
              : "HUNTER dodged! The attack missed!",
            "good",
          );
          return;
        }
        let dmg = atk.power * m.atkMult * rand(0.9, 1.1);
        if (p.guarding) dmg *= CONFIG.GUARD_TAKEN;
        dmg = Math.max(1, Math.round(dmg));
        p.hp = Math.max(0, p.hp - dmg);
        Audio8.sfx(p.guarding ? "clang" : "hurt");
        anim($("playerSprite"), "a-shake", 400);
        pop($("playerSprite"), `-${dmg}`);
        renderBattle();
        await say(
          `HUNTER took ${dmg} damage!${p.guarding ? " (GUARDED)" : ""}${atk.heavy ? "\nIt was a HEAVY blow!" : ""}`,
          "bad",
        );
        if (p.charge > 0 && atk.heavy && p.hp > 0) {
          if (Math.random() < CONFIG.HEAVY_INTERRUPT_CHANCE) {
            p.charge = 0;
            renderBattle();
            await say("The impact knocked HUNTER out of the charge!", "bad");
          } else await say("HUNTER held the charge through the blow!", "good");
        }
        await checkFaint();
      }
      async function monsterFlee(limping) {
        const m = G.foe;
        if (limping) await say(`The ${m.name} is limping...`, "warn");
        const dest =
          limping && m.area !== NEST
            ? NEST
            : pick(neighbors(m.area).filter((a) => a !== 0));
        Audio8.sfx("swoosh");
        $("enemySprite").classList.add("a-flee");
        await pause(650);
        Object.assign(m, {
          area: dest,
          posArea: null,
          turnsInArea: 0,
          roamTimer: 0,
          restTurns: 0,
          sleeping: false,
          fleeAt: randInt(CONFIG.FLEE_MIN, CONFIG.FLEE_MAX),
        });
        await say(
          G.paint > 0
            ? `The ${m.name} fled to AREA ${dest}!\nThe paintball marks its trail.`
            : `The ${m.name} fled!\nWithout a paintball you'll have to search...`,
          "warn",
        );
        await returnToField(800);
      }
      async function tryEscape() {
        const m = G.foe,
          sure = m.trapped > 0 || m.sleeping || !!m.skipNext;
        if (sure || Math.random() < CONFIG.ESCAPE_CHANCE) {
          Audio8.sfx("area");
          await say("HUNTER got away safely!", "good");
          G.turn++;
          await returnToField(CONFIG.GRACE_MS);
          return true;
        }
        await say(`Couldn't escape!\nThe ${m.name} blocks the way!`, "bad");
        return false;
      }
      async function endOfTurnTicks() {
        const p = G.player,
          m = G.foe;
        p.guarding = false;
        p.foresight = false;
        G.turn++;
        G.itemsUsed = 0;
        if (G.paint > 0 && --G.paint === 0) {
          renderBattle();
          await say("The paintball scent faded...", "warn");
        }
        if (m.flash > 0 && --m.flash === 0) {
          renderBattle();
          await say(`The ${m.name} can see again!`, "warn");
        }
        if (p.buffs.might > 0 && --p.buffs.might === 0) {
          renderBattle();
          await say("The MIGHT SEED wore off.", "warn");
        }
        renderBattle();
      }

      /* =====================================================================
   STEP 14 — BATTLE ENDINGS (return to field, faint/cart, carving, capture)
   ===================================================================== */
      async function returnToField(graceMs) {
        const tr = $("trans");
        tr.className = "fadeIn";
        await pause(260);
        const p = G.player;
        p.charge = 0;
        p.guarding = false;
        p.foresight = false;
        G.foe = null;
        G.itemsUsed = 0;
        G.screen = "field";
        refreshEntities();
        const now = performance.now();
        G.grace = now + graceMs;
        G.ents.forEach((e) => {
          e.alerted = false;
          e.bang = 0;
          e.mv = null;
          e.next = now + 500;
        });
        showScreen();
        setPhase(0);
        Audio8.music(fieldMusic());
        tr.className = "fadeOut";
        await pause(260);
        tr.className = "";
      }
      async function checkFaint() {
        const p = G.player;
        if (p.hp > 0 || G.over) return false;
        const ps = $("playerSprite");
        Audio8.sfx("faint");
        ps.classList.add("a-faint");
        await pause(650);
        p.down = true;
        renderBattle();
        await say("HUNTER fainted!", "bad");
        p.carts++;
        renderBattle();
        if (p.carts >= CONFIG.MAX_CARTS) {
          await say(
            `HUNTER has fainted ${p.carts} times...\nQUEST FAILED.`,
            "bad",
          );
          await finishQuest("fail");
          return true;
        }
        await say(
          `The Felynes carted HUNTER back to camp!\n(CARTS ${p.carts}/${CONFIG.MAX_CARTS} · reward money -1/3)`,
          "warn",
        );
        const tr = $("trans");
        tr.className = "fadeIn";
        await pause(300);
        Object.assign(p, {
          hp: p.maxHp,
          charge: 0,
          spirit: 0,
          guarding: false,
          foresight: false,
          down: false,
        });
        p.buffs.might = 0;
        const foe = G.foe;
        foe.trapped = 0;
        foe.flash = 0;
        foe.skipNext = null;
        G.foe = null;
        G.itemsUsed = 0;
        G.screen = "field";
        Object.assign(G.f, {
          area: 0,
          x: CAMP_SPAWN.x,
          y: CAMP_SPAWN.y,
          dir: CAMP_SPAWN.dir,
          mv: null,
        });
        const msgs = worldTick();
        buildEntities(true);
        G.grace = performance.now() + CONFIG.GRACE_MS;
        showScreen();
        setPhase(0);
        showLocation(0);
        Audio8.music("camp");
        tr.className = "fadeOut";
        await pause(300);
        tr.className = "";
        if (msgs.length) toast(msgs.join("\n"));
        return true;
      }
      async function waitCarve(i, n) {
        const g = G;
        setPhase(0);
        setMode("carve", { i, n });
        await new Promise((res) => {
          carveResolve = res;
        });
        if (G !== g) throw new Abort();
      }
      async function foeDefeated() {
        const m = G.foe,
          es = $("enemySprite");
        m.dead = true;
        Audio8.sfx("faint");
        es.classList.add("corpse");
        renderBattle();
        if (!m.isBoss) {
          await say(`The wild ${m.name} was defeated!`, "good");
          for (let i = 0; i < CONFIG.SMALL_CARVES; i++) {
            await waitCarve(i, CONFIG.SMALL_CARVES);
            const r = weighted(SMALLS[m.key].carve);
            addGathered(r.name);
            Audio8.sfx("carve");
            pop(es, `+${r.name}`, "loot");
            await say(`HUNTER carved ${r.name}!`, "good");
          }
          await returnToField(1500);
          return;
        }
        Audio8.music("win");
        await say(
          `The ${m.name} collapsed...\nThe ${m.name} was SLAIN!`,
          "good",
        );
        G.carves = [];
        for (let i = 0; i < CONFIG.CARVES; i++) {
          await waitCarve(i, CONFIG.CARVES);
          const r = weighted(LOOT[m.key].carve);
          G.carves.push(r);
          Audio8.sfx("carve");
          pop(es, `+${r.name}`, "loot");
          await say(
            `CARVE ${i + 1}/${CONFIG.CARVES}\nHUNTER carved ${r.name}!`,

          );
        }
        await say("QUEST COMPLETE!\nReturning to the village...", "good");
        await finishQuest("slay");
      }
      async function captureWin() {
        const m = G.foe;
        m.sleeping = true;
        m.trapped = 0;
        renderBattle();
        Audio8.music("win");
        Audio8.sfx("capture");
        await say(`The ${m.name} fell into a deep sleep...`, "good");
        await say(`The ${m.name} was CAPTURED!`, "good");
        await say(
          "Captured monsters can't be carved...\nbut the Guild pays a CAPTURE BONUS!",
          "dim",
        );
        await finishQuest("capture");
      }

      /* =====================================================================
   STEP 15 — QUEST REWARDS & ITEM BOX
   SLAY: 4 rewards + breaks + 3 carves + gathered · CAPTURE: 5 rewards + 3 bonus + breaks + gathered, ×1.2 money
   MONEY: base × (1 − carts/3) · FAIL / ABANDON: nothing
   ===================================================================== */
      async function finishQuest(outcome) {
        const m = G.monster,
          L = LOOT[G.monsterKey],
          p = G.player;
        const win = outcome === "slay" || outcome === "capture",
          cap = outcome === "capture";
        const sections = [];
        let zenny = 0,
          base = 0;
        if (win) {
          const roll = (t, n) => Array.from({ length: n }, () => weighted(t));
          sections.push({
            title: "MAIN REWARDS",
            items: roll(
              L.reward,
              cap ? CONFIG.CAPTURE_MAIN_REWARDS : CONFIG.MAIN_REWARDS,
            ),
          });
          if (cap)
            sections.push({
              title: "CAPTURE BONUS",
              bonus: true,
              items: roll(L.capture, CONFIG.CAPTURE_BONUS),
            });
          const broken = Object.keys(m.parts).filter((k) => m.parts[k].broken);
          if (broken.length)
            sections.push({
              title: "BREAK REWARDS",
              items: broken.map((k) => weighted(L.breaks[k])),
            });
          if (G.carves.length)
            sections.push({ title: "CARVES", items: G.carves });
          const gath = Object.entries(G.gathered).flatMap(([n, c]) =>
            Array.from({ length: c }, () => ({
              name: n,
              rar: ITEM_RAR[n] || 1,
            })),
          );
          if (gath.length)
            sections.push({
              title: "GATHERED & SMALL MONSTER CARVES",
              items: gath,
            });
          base = Math.round(L.zenny * (cap ? CONFIG.CAPTURE_ZENNY_MULT : 1));
          zenny = Math.round(base * (1 - p.carts / CONFIG.MAX_CARTS));
        } else Audio8.music("fail");
        G.over = true;
        G.outcome = outcome;
        G.boxed = false;
        G.rewards = { sections, zenny, base };
        setPhase(0);
        miniKey = "";
        const tr = $("trans");
        try {
          tr.className = "fadeIn";
          await pause(350);
          renderRewards();
          $("rewardOv").classList.remove("hidden");
          tr.className = "fadeOut";
          await pause(300);
        } catch (e) {
          if (!(e instanceof Abort)) throw e;
        }
        tr.className = "";
      }

      function renderRewards() {
        const R = G.rewards,
          o = G.outcome,
          m = G.monster,
          p = G.player,
          win = o === "slay" || o === "capture";
        const heads = {
          slay: "QUEST COMPLETE!",

            const agg = {};
            s.items.forEach((it) => {
              (agg[it.name] = agg[it.name] || { rar: it.rar, n: 0 }).n++;
            });
            body += `<div class="rsec ${s.bonus ? "bonus" : ""}"><h4>${s.bonus ? "★ " : ""}${s.title}</h4><div class="rgrid">${Object.entries(
              agg,
            )
              .map(([n, v]) => slotHtml(n, v.rar, v.n, (delay += 0.07)))
              .join("")}</div></div>`;
          });
          const notes = [];
          if (o === "capture") notes.push("capture x1.2");
          if (p.carts) notes.push(`-${p.carts}/${CONFIG.MAX_CARTS} for carts`);
          body += `<div class="zen">REWARD MONEY: ${R.zenny}z <small>(base ${R.base}z${notes.length ? " · " + notes.join(" · ") : ""})</small></div>`;
        } else
          body = `<p class="ftxt">${o === "fail" ? "HUNTER fainted 3 times.<br>The Guild pays nothing, and everything gathered was lost." : "HUNTER returned to the village empty-handed."}</p>`;
        const otherKey = G.monsterKey === "rathalos" ? "tigrex" : "rathalos";
        const btns =
          win && !G.boxed
            ? `<button class="rbtn big" data-act="putall">PUT ALL IN BOX</button>`
            : `${G.boxed ? `<div class="boxed">✓ Everything was stored in your ITEM BOX!<br>Wallet: ${BOX.zenny}z</div>` : ""}
       <button class="rbtn" data-act="rematch">REMATCH: ${m.name}</button>
       <button class="rbtn alt" data-act="hunt" data-val="${otherKey}">NEW QUEST: ${MONSTERS[otherKey].name}</button>`;
        $("rewardOv").innerHTML = `
    <div class="rhead ${win ? "" : "fail"}"><h3>${heads[o]}</h3>
      <span>${m.name} · ${G.turn} turns · CARTS ${p.carts}/${CONFIG.MAX_CARTS}</span></div>
    <div class="rbody">${body}</div>
    <div class="rbtns">${btns}</div>`;
      }
      function putAllInBox() {
        if (!G || !G.rewards || G.boxed) return;
        G.rewards.sections.forEach((s) =>
          s.items.forEach((it) => {
            BOX.items[it.name] = (BOX.items[it.name] || 0) + 1;
          }),
        );
        BOX.zenny += G.rewards.zenny;
        BOX.hunts++;
        saveBox();
        G.boxed = true;
        Audio8.sfx("buy");
        renderRewards();
      }

      /* =====================================================================
   STEP 16 — CONFIRMATION PROMPTS (actions confirm; items don't)
   ===================================================================== */
      function pickMove(id) {
        const mv = findMove(id),
          p = G.player;
        if (!mv || moveDisabled(mv)) return;
        Audio8.sfx("select");
        if (isAttack(mv)) {
          setMode("target", { moveId: id });
          return;
        }
        const drop =
          p.charge > 0 && mv.type !== "charge"
            ? "<br>Your held charge will be lost!"
            : "";
        if (mv.type === "charge")
          setMode("confirm", {
            q: `Charge the ${WEAPONS[p.weapon].name}?`,
            sub: `Lv${p.charge} -> Lv${p.charge + 1} held. A HEAVY hit may break it (30%).`,
            action: { kind: "move", moveId: id },
            back: "fight",
          });
        else if (mv.type === "guard")
          setMode("confirm", {
            q: "Raise your GUARD?",
            sub: `Take only 40% damage this turn.${drop}`,
            action: { kind: "move", moveId: id },
            back: "fight",
          });
      }
      function confirmAttack(moveId, part) {
        const mv = findMove(moveId),
          p = G.player,
          m = G.foe;
        let name = mv.name;
        if (mv.type === "release")
          name += ` Lv${p.charge + 1} (${CHARGE_MULT[p.charge]}x)`;
        if (mv.type === "finisher") name += ` (x${1 + 0.5 * p.spirit})`;
        let sub;
        if (m.sleeping) sub = "SNEAK ATTACK: 100% HIT · WAKE-UP x2";
        else {
          const c = hitChances(mv, part);
          sub = `HIT ${c.target}% · DRIFT ${c.overall - c.target}% (to ${PARTS[part].drift.map((d) => PARTS[d].label).join("/")}) · MISS ${100 - c.overall}%`;
          if (m.trapped > 0) sub += " (TRAPPED +25)";
        }
        if (p.charge > 0 && mv.type !== "release")
          sub += "<br>Your held charge will be lost!";
        if (getSharp(p.sharp).bounce)
          sub += "<br>WARNING: RED edge, the attack will BOUNCE!";
        Audio8.sfx("select");
        setMode("confirm", {
          q: `Use ${name}<br>on the ${PARTS[part].label}?`,
          sub,
          action: { kind: "move", moveId, target: part },
          back: "target",
          backData: { moveId },
        });
      }
      function confirmRun() {
        const m = G.foe,
          sure = m.trapped > 0 || m.sleeping || !!m.skipNext;
        Audio8.sfx("select");
        setMode("confirm", {
          q: `Retreat from the ${m.name}?`,
          sub: sure
            ? "It can't chase you right now: 100% escape."
            : `${Math.round(CONFIG.ESCAPE_CHANCE * 100)}% chance. A failed escape costs your turn.`,
          action: { kind: "run" },
          back: "main",
        });
      }

      /* =====================================================================
   STEP 17 — RENDERING: BATTLE HUD, BOTTOM PANEL, MINIMAP, FULL MAP
   ===================================================================== */
      const hpColor = (pct) =>
        pct > 50 ? "#58d080" : pct > 20 ? "#f8d030" : "#f05038";
      const chip = (t, c) => `<span class="chip ${c}">${t}</span>`;
      function setBar(el, pct, color) {
        el.style.width = clamp(pct, 0, 100) + "%";
        el.style.backgroundColor = color;
      }
      const pips = (n, max) =>
        Array.from(
          { length: max },
          (_, i) => `<span class="pip ${i < n ? "on" : ""}"></span>`,
        ).join("");
      const balls = (n) =>
        Array.from(
          { length: CONFIG.MAX_CARTS },
          (_, i) => `<span class="ball ${i < n ? "used" : ""}"></span>`,
        ).join("");

      function showScreen() {
        $("battle").classList.toggle("hidden", !G || G.screen !== "battle");
      }

      function renderBattle() {
        if (!G || !G.foe) return;
        const p = G.player,
          m = G.foe,
          w = WEAPONS[p.weapon];
        $("eName").textContent = m.name;
        $("eRank").textContent = m.isBoss ? `★${m.rank}` : `Lv${m.rank}`;
        const eP = (m.hp / m.maxHp) * 100;
        setBar($("eHp"), eP, hpColor(eP));
        for (const k in PARTS) {
          const pt = m.parts[k],
            el = $("pb-" + k);
          el.classList.toggle("brk", pt.broken);
          setBar(
            el.querySelector(".fill"),
            (pt.hp / pt.max) * 100,
            pt.broken ? "#8a8a8a" : "#e09030",
          );
        }
        const ec = [];
        if (m.captured) ec.push(chip("CAPTURED", "c-cap"));
        else if (m.isBoss && !m.dead && eP <= CONFIG.CAPTURE_PCT * 100)
          ec.push(chip("CAPTURE OK", "c-cap"));
        if (m.sleeping && !m.captured) ec.push(chip("SLP", "c-slp"));
        if (m.trapped > 0) ec.push(chip(`TRAP ${m.trapped}`, "c-trap"));
        if (m.tranq > 0 && !m.captured)
          ec.push(chip(`TRANQ ${m.tranq}/${CONFIG.TRANQ_NEEDED}`, "c-tq"));
        if (m.flash > 0) ec.push(chip(`BLIND ${m.flash}`, "c-bln"));
        if (m.isBoss && G.paint > 0) ec.push(chip(`PAINT ${G.paint}`, "c-pnt"));
        if (m.skipNext) ec.push(chip("STUN", "c-stun"));
        if (m.isBoss && m.parts.tail.broken) ec.push(chip("ATK↓", "c-cut"));
        if (m.armorCracked) ec.push(chip("DEF↓", "c-crk"));
        $("eChips").innerHTML = ec.join("");

        $("pWpn").textContent = w.short;
        $("pBalls").innerHTML = balls(p.carts);
        const pP = (p.hp / p.maxHp) * 100;
        setBar($("pHp"), pP, hpColor(pP));
        $("pHpNum").textContent = `${p.hp}/${p.maxHp}`;
        const s = getSharp(p.sharp);
        setBar($("pSharp"), (p.sharp / CONFIG.SHARP_MAX) * 100, s.color);
        $("pSharpLbl").innerHTML =
          `<span style="color:${s.text}">${s.name}</span> ${p.sharp}/${CONFIG.SHARP_MAX}`;
        $("pGauge").innerHTML =
          p.weapon === "greatsword"
            ? `CHG${pips(p.charge, 2)}`
            : `SPR${pips(p.spirit, 3)}`;
        const pc = [];
        if (p.buffs.might > 0) pc.push(chip(`MIGHT ${p.buffs.might}`, "c-mgt"));
        if (p.guarding) pc.push(chip("GUARD", "c-grd"));
        if (p.foresight) pc.push(chip("FORESIGHT", "c-fs"));
        if (s.bounce) pc.push(chip("BOUNCE!", "c-crk"));
        $("pChips").innerHTML = pc.join("");

        const es = $("enemySprite");
        es.querySelector(".zzz").classList.toggle("hidden", !m.sleeping);
        es.classList.toggle("small", !m.isBoss);
        es.classList.toggle("trapped", m.trapped > 0);
        const ps = $("playerSprite");
        ps.classList.toggle("chg1", p.charge === 1);
        ps.classList.toggle("chg2", p.charge >= 2);
        ps.classList.toggle("guard", p.guarding);
        ps.classList.toggle("gone", p.down);
      }

      function setMode(mode, data = {}) {
        UI.mode = mode;
        UI.data = data;
        if (G && G.screen === "battle" && !G.over) {
          if (mode === "main" || mode === "bag") setPhase(1);
          else if (["fight", "target", "confirm"].includes(mode)) setPhase(2);
          if (mode === "main" && G.loggedTurn !== G.turn) {
            G.loggedTurn = G.turn;
            addLog(`━━ TURN ${G.turn} ━━`, "turn");
          }
        }
        renderPanel();
      }
      function moveSub(mv) {
        const p = G.player;
        switch (mv.type) {
          case "release":
            return `${CHARGE_MULT[p.charge]}x NOW`;
          case "charge":
            return `HELD Lv${p.charge}/2`;
          case "guard":
            return "DMG -60%";
          case "counter":
            return p.spirit < 1 ? "NEED SPIRIT" : "EVADE";
          case "finisher":
            return p.spirit < 1 ? "NEED SPIRIT" : `x${1 + 0.5 * p.spirit}`;
          default:
            return `POW ${mv.power}`;
        }
      }
      function moveInfo(mv) {
        const p = G.player,
          s = getSharp(p.sharp);
        const stats = mv.power
          ? `POW ${mv.power} · ACC ${mv.acc >= 0 ? "+" : ""}${mv.acc}`
          : "";
        return `<div>EDGE <b style="color:${s.text}">${p.sharp}/${CONFIG.SHARP_MAX}</b> (-${mv.sharp})</div>
    <div>TYPE/${mv.tag}</div><div>${stats}</div><div class="desc">${mv.desc}</div>`;
      }

      function renderPanel() {
        const P = $("panel");
        if (!G) {
          P.innerHTML = "";
          return;
        }
        if (G.over) {
          const win = G.outcome === "slay" || G.outcome === "capture";
          const otherKey = G.monsterKey === "rathalos" ? "tigrex" : "rathalos";
          P.innerHTML = `<div class="tb">${win ? "Great hunting!" : "The hunt is over."}<br>Check the reward screen above.</div>
      <div class="cmds"><button class="cmd k-fight" data-act="rematch">REMATCH</button>
        <button class="cmd k-run" data-act="hunt" data-val="${otherKey}">HUNT<small>${MONSTERS[otherKey].name}</small></button></div>`;
          return;
        }
        if (G.screen === "field") {
          renderFieldPanel(P);
          return;
        }

        const mode = UI.mode,
          d = UI.data,
          p = G.player,

          w = WEAPONS[p.weapon];
        let h = "";
        switch (mode) {
          case "message":
            h = `<div class="tb adv" data-act="advance"><span id="msg"></span><span id="arrow" class="arrow">▼</span></div>`;
            break;
          case "fight":
            h = `<div class="movebox">${w.moves
              .map(
                (mv) =>
                  `<button class="mv" data-act="move" data-val="${mv.id}" data-info="${mv.id}" ${moveDisabled(mv) ? "disabled" : ""}>${mv.name}<small>${moveSub(mv)}</small></button>`,
              )
              .join("")}</div>
        <div class="minfo"><div id="mInfo">${moveInfo(w.moves[0])}</div><button class="cmd back" data-act="back">BACK</button></div>`;
            break;
          case "target": {
            const mv = findMove(d.moveId);
            h = `<div class="tb">Aim ${mv.name}<br>at which part?
          <div class="sub">${m.sleeping ? "Target is ASLEEP: guaranteed hit, x2 damage" : "A near-miss DRIFTS to an adjacent part"}</div></div>
        <div class="cmds">${Object.keys(PARTS)
          .map((k) => {
            const c = m.sleeping ? 100 : hitChances(mv, k).target,

            return `<button class="cmd k-${k}" data-act="part" data-val="${k}">${PARTS[k].label} ${c}%<small>${pt.broken ? "BROKEN" : `${pt.hp}/${pt.max}`} · DMG x${PARTS[k].dmgMult}</small></button>`;
          })
          .join(
            "",
          )}<button class="cmd back" data-act="back">BACK</button></div>`;
            break;
          }
          case "confirm":
            h = `<div class="tb">${d.q}<div class="sub">${d.sub || ""}</div></div>
        <div class="yn"><button data-act="yes">YES</button><button data-act="no">NO</button></div>`;
            break;
          case "bag": {
            const left = CONFIG.MAX_ITEMS_PER_TURN - G.itemsUsed;
            h = `<div class="tb" id="bagInfo">${left > 0 ? "Choose an item.<br>It takes effect immediately." : "No more items this turn!"}
          <div class="sub">ITEMS USED ${G.itemsUsed}/${CONFIG.MAX_ITEMS_PER_TURN} THIS TURN · no turn cost</div></div>
        <div class="baglist">${Object.keys(ITEMS)
          .map((k) => {
            const it = ITEMS[k],
              bossOnly = ["paintball", "shock", "tranq"].includes(k);
            const dis =

            ${pimg(DATA["item_" + k])}${it.name}<span class="q">x${G.inventory[k]}</span></button>`;
          })
          .join(
            "",
          )}<button class="cmd back" data-act="back">BACK</button></div>`;
            break;
          }
          case "carve":
            h = `<div class="tb">The ${m.name} lies still...<br>Carve it for materials! (${d.i + 1}/${d.n})
          <div class="sub">Press CARVE or Z for each carve.</div></div>
        <div class="cmds"><button class="cmd k-fight carvebtn" data-act="carve">CARVE</button></div>`;
            break;
          default:
            h = `<div class="tb">What will<br>HUNTER do?<div class="sub">TURN ${G.turn} · ITEMS ${G.itemsUsed}/${CONFIG.MAX_ITEMS_PER_TURN} · items don't end your turn</div></div>
        <div class="cmds">
          <button class="cmd k-fight" data-act="fight">FIGHT</button>

          <button class="cmd k-map" data-act="map">MAP</button>
          <button class="cmd k-run" data-act="run">RUN</button>
        </div>`;
        }
        P.innerHTML = h;
      }

      function renderFieldPanel(P) {

    <div class="fmid">

        <div class="srow"><b>AREA</b>${AREAS[f.area].name} · ${AREAS[f.area].sub}</div>

      // Always-on minimap (top-right, field only). Rebuilt only when something on it changes.

      // Full Mountain Stream map with legend
      function renderMapOv() {

      <div class="anum ${a === cur ? "cur" : ""}" style="left:${A.mx}%;top:${A.my}%">${a === 0 ? `<img src="${DATA.ic_tent}" style="width:1.2em;display:block" alt="">` : a}</div>`;
          if (A.gather)
            h += `<div class="gics" style="left:${A.mx}%;top:${A.my + 9}%">${[...new Set(A.gather)].map((g) => `<img src="${DATA["g_" + g]}" alt="">`).join("")}</div>`;

        h += `</div><div class="legend"><div class="lgh">Legend</div>
    ${Object.keys(GATHER)
      .map((g) => `<div>${pimg(DATA["g_" + g])} ${GATHER[g].label}</div>`)
      .join("")}
    <div class="lgs">${pimg(DATA.player)} YOU<br>${pimg(DATA.ic_bubble)} NPC<br>${pimg(DATA["mf_" + m.key])} ${m.name}
      ${showMon ? `→ AREA ${m.area}${m.sleeping ? " (ASLEEP)" : ""}` : "(needs PAINTBALL)"}<br>
