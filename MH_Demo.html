      /* =====================================================================
   STEP 18 — FIELD RENDERER (canvas 480×320 at 2× = 15×10 tiles)
   Everything is drawn fully opaque (no lingering globalAlpha).
   ===================================================================== */
      const CV = $("fieldCv"),
        CX = CV.getContext("2d");
      function entPos(e) {
        const t = e.mv ? Math.min(1, e.mv.t) : 0;
        return {
          x: (e.x + (e.mv ? (e.mv.tx - e.x) * t : 0)) * 16,
          y: (e.y + (e.mv ? (e.mv.ty - e.y) * t : 0)) * 16,
          t,
        };
      }
      function ellipse(x, y, rx, ry) {
        CX.beginPath();
        CX.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        CX.fill();
      }
      function tri(a, b, c, d, e, f) {
        CX.beginPath();
        CX.moveTo(a, b);
        CX.lineTo(c, d);
        CX.lineTo(e, f);
        CX.closePath();
        CX.fill();
      }
      function blit(img, x, y, flip) {
        x = Math.round(x);
        y = Math.round(y);
        if (!flip) {
          CX.drawImage(img, x, y);
          return;
        }
        CX.save();
        CX.translate(x + img.width, y);
        CX.scale(-1, 1);
        CX.drawImage(img, 0, 0);
        CX.restore();
      }
      function drawBang(cx, top) {
        cx = Math.round(cx);
        top = Math.round(top);
        CX.fillStyle = "#283038";
        CX.fillRect(cx - 5, top - 12, 10, 12);
        CX.fillStyle = "#ffffff";
        CX.fillRect(cx - 4, top - 11, 8, 10);
        CX.fillStyle = "#e03030";
        CX.fillRect(cx - 1, top - 10, 2, 5);
        CX.fillRect(cx - 1, top - 4, 2, 2);
      }
      function drawObject(o) {
        const X = o.x * 16,
          Y = o.y * 16;
        switch (o.type) {
          case "tent":
            CX.fillStyle = "rgba(0,0,0,.2)";
            CX.fillRect(X + 2, Y + 27, 46, 5);
            CX.fillStyle = "#7a3020";
            tri(X, Y + 30, X + 24, Y + 1, X + 48, Y + 30);
            CX.fillStyle = "#d84838";
            tri(X + 3, Y + 29, X + 24, Y + 4, X + 45, Y + 29);
            CX.fillStyle = "#f0d8b0";
            tri(X + 14, Y + 29, X + 24, Y + 10, X + 34, Y + 29);
            CX.fillStyle = "#402018";
            tri(X + 18, Y + 29, X + 24, Y + 17, X + 30, Y + 29);
            CX.fillStyle = "#f8c040";
            CX.fillRect(X + 23, Y, 2, 3);
            break;
          case "bed":
            CX.fillStyle = "#6a4428";
            CX.fillRect(X + 1, Y + 1, 14, 15);
            CX.fillStyle = "#f8f8f0";
            CX.fillRect(X + 2, Y + 2, 12, 13);
            CX.fillStyle = "#dce4f0";
            CX.fillRect(X + 4, Y + 3, 8, 3);
            CX.fillStyle = "#4878c8";
            CX.fillRect(X + 2, Y + 8, 12, 7);
            break;
          case "box":
            CX.fillStyle = "rgba(0,0,0,.2)";
            CX.fillRect(X + 1, Y + 13, 15, 3);
            CX.fillStyle = "#1f3f80";
            CX.fillRect(X + 1, Y + 3, 14, 12);
            CX.fillStyle = "#3c6cc8";
            CX.fillRect(X + 2, Y + 4, 12, 4);
            CX.fillRect(X + 2, Y + 9, 12, 5);
            CX.fillStyle = "#f0c040";
            CX.fillRect(X + 7, Y + 7, 2, 3);
            break;
          case "itembox":
            CX.fillStyle = "rgba(0,0,0,.2)";
            CX.fillRect(X + 1, Y + 13, 15, 3);
            CX.fillStyle = "#601818";
            CX.fillRect(X + 1, Y + 3, 14, 12);
            CX.fillStyle = "#c83a30";
            CX.fillRect(X + 2, Y + 4, 12, 4);
            CX.fillRect(X + 2, Y + 9, 12, 5);
            CX.fillStyle = "#e8b840";
            CX.fillRect(X + 1, Y + 8, 14, 1);
            CX.fillRect(X + 7, Y + 7, 2, 3);
            break;
          case "sign":
            CX.fillStyle = "#6a4428";
            CX.fillRect(X + 7, Y + 9, 2, 7);
            CX.fillStyle = "#8a5a30";
            CX.fillRect(X + 2, Y + 2, 12, 8);
            CX.fillStyle = "#c8945a";
            CX.fillRect(X + 3, Y + 3, 10, 6);
            CX.fillStyle = "#6a4428";
            CX.fillRect(X + 5, Y + 5, 6, 1);
            CX.fillRect(X + 5, Y + 7, 4, 1);
            break;
        }
      }

      function drawField(now) {
        const f = G.f,
          M = MAPS[f.area],
          th = THEMES[M.theme];
        CX.setTransform(2, 0, 0, 2, 0, 0);
        CX.imageSmoothingEnabled = false;
        CX.globalAlpha = 1;
        const pp = entPos(f);
        const camX = Math.round(clamp(pp.x + 8 - 120, 0, M.w * 16 - 240));
        const camY = Math.round(clamp(pp.y + 8 - 80, 0, M.h * 16 - 160));
        CX.fillStyle = "#101418";
        CX.fillRect(0, 0, 240, 160);
        CX.save();
        CX.translate(-camX, -camY);

        // Tiles
        const wf = Math.floor(now / 450) % 2;
        const v = (arr, x, y) => arr[(x * 7 + y * 13) % arr.length];
        const x0 = Math.floor(camX / 16),
          y0 = Math.floor(camY / 16);
        const x1 = Math.min(M.w - 1, x0 + 15),
          y1 = Math.min(M.h - 1, y0 + 10);
        for (let y = y0; y <= y1; y++)
          for (let x = x0; x <= x1; x++) {
            const c = M.tiles[y][x];
            const set =
              c === "E" ? TILES[th.path] : TILES[c] || TILES[th.ground];
            CX.drawImage(
              c === "~" || c === "w" ? set[wf] : v(set, x, y),
              x * 16,
              y * 16,
            );
            if (OVER[c]) CX.drawImage(v(OVER[c], x, y), x * 16, y * 16);
          }
        // Exit markers with the destination area number (pixel font)
        const glow = Math.sin(now / 250) > 0;
        M.exits.forEach((e) => {
          const X = e.x * 16,
            Y = e.y * 16,
            label = e.to === 0 ? "C" : String(e.to);
          CX.fillStyle = glow ? "#f8d850" : "#e0b830";
          CX.fillRect(X + 3, Y + 3, 10, 10);
          CX.fillStyle = "#1c2818";
          CX.fillRect(X + 3, Y + 3, 10, 1);
          CX.fillRect(X + 3, Y + 12, 10, 1);
          CX.fillRect(X + 3, Y + 3, 1, 10);
          CX.fillRect(X + 12, Y + 3, 1, 10);
          pxText(
            CX,
            label,
            X + 8 - Math.floor((label.length * 4 - 1) / 2),
            Y + 6,
            "#1c2818",
          );
        });
        // Props & gathering points (solid sprites; exhausted spots turn grey but stay opaque)
        M.objects.forEach(drawObject);
        M.gathers.forEach((gp) => {
          const used = G.gatherUses[`${f.area},${gp.x},${gp.y}`] || 0;
          CX.fillStyle = "rgba(0,0,0,.25)";
          ellipse(gp.x * 16 + 8, gp.y * 16 + 14, 6, 2);
          CX.drawImage(
            ART[(used >= CONFIG.GATHER_USES ? "gx_" : "g_") + gp.type],
            gp.x * 16,
            gp.y * 16 - 2,
          );
        });
        // Entities + hunter, y-sorted
        const list = G.ents.map((e) => ({ e, p: entPos(e) }));
        list.push({ e: null, p: pp });
        list.sort((a, b) => a.p.y - b.p.y);
        for (const { e, p } of list) {
          if (!e) {
            blit(
              SPR[f.dir][f.mv ? (f.step % 2 ? "A" : "B") : "S"],
              p.x,
              p.y - 2,
            );
            continue;
          }
          if (e.kind === "npc") {
            blit(
              e.look === "hunter"
                ? NPCSPR[e.dir][e.mv ? "A" : "S"]
                : CATSPR[e.look],
              p.x,
              p.y - 2,
            );
            continue;
          }
          const img = ART["mf_" + e.key],
            hop = e.mv ? -2 * Math.sin(Math.PI * p.t) : 0;
          const top = p.y + 16 - img.height;
          CX.fillStyle = "rgba(0,0,0,.3)";
          ellipse(p.x + 8, p.y + 14, img.width * 0.38, 3);
          blit(img, p.x + 8 - img.width / 2, top + hop, e.dir === "right");
          if (e.kind === "boss" && e.sleeping) {
            const k = (now / 900) % 1;
            pxText(
              CX,
              "Z",
              Math.round(p.x + 16 + k * 4),
              Math.round(top - 2 - k * 6),
              "#3848a8",
            );
          }
          if (e.bang > now) drawBang(p.x + 8, top - 1);
        }
        CX.restore();
        // Cave darkness around the hunter (Wyvern Nest)
        if (M.theme === "cave") {
          const sx = pp.x - camX + 8,
            sy = pp.y - camY + 8;
          const gr = CX.createRadialGradient(sx, sy, 30, sx, sy, 150);
          gr.addColorStop(0, "rgba(10,6,30,0)");
          gr.addColorStop(1, "rgba(10,6,30,.6)");
          CX.fillStyle = gr;
          CX.fillRect(0, 0, 240, 160);
        }
      }

      /* =====================================================================
   STEP 19 — SMALL HELPERS
   ===================================================================== */
      function anim(el, cls, ms) {
        el.classList.remove(cls);
        void el.offsetWidth;
        el.classList.add(cls);
        if (ms) setTimeout(() => el.classList.remove(cls), ms);
      }
      function pop(el, text, cls = "") {
        const sc = $("screen"),
          r = el.getBoundingClientRect(),
          s = sc.getBoundingClientRect();
        const d = document.createElement("div");
        d.className = "pop " + cls;
        d.textContent = text;
        d.style.left = r.left + r.width / 2 - s.left + "px";
        d.style.top = r.top - s.top + r.height * 0.15 + "px";
        sc.appendChild(d);
        setTimeout(() => d.remove(), 1400);
      }
      function addLog(msg, cls = "") {
        const d = document.createElement("div");
        d.className = cls ? "l-" + cls : "";
        d.textContent = msg;
        $("log").appendChild(d);
        $("log").scrollTop = $("log").scrollHeight;
      }
      function setPhase(n) {
        document
          .querySelectorAll(".ph")
          .forEach((el) => el.classList.toggle("on", +el.dataset.p === n));
      }
      function toggleMute() {
        Audio8.init();
        Audio8.setMuted(!Audio8.muted);
        BOX.muted = Audio8.muted;
        saveBox();
        $("muteBtn").textContent = `♪ MUSIC: ${Audio8.muted ? "OFF" : "ON"}`;
      }

      /* =====================================================================
   STEP 20 — LIFECYCLE
   ===================================================================== */
      function restart(mk) {
        newGame(MONSTERS[mk] ? mk : "rathalos");
      }
      function goBack() {
        if (!G || G.busy || G.screen !== "battle") return;
        const backs = { fight: "main", target: "fight", bag: "main" };
        if (UI.mode === "confirm") {
          Audio8.sfx("back");
          setMode(UI.data.back, UI.data.backData || {});
        } else if (backs[UI.mode]) {
          Audio8.sfx("back");
          setMode(backs[UI.mode]);
        }
      }

      /* =====================================================================
   STEP 21 — INPUT (mouse/touch, keyboard, on-screen D-pad)
   Audio starts on the first user gesture (browser autoplay rules).
   ===================================================================== */
      document.addEventListener("pointerdown", () => Audio8.init(), true);

      document.addEventListener("click", (e) => {
        if (
          (advance || typing) &&
          e.target.closest("#gb") &&
          !e.target.closest("[data-dir]")
        ) {
          doAdvance();
          return;
        }
        const t = e.target.closest("[data-act]");
        if (!t || t.disabled) return;
        const act = t.dataset.act,
          val = t.dataset.val;

        switch (act) {
          case "reset":
          case "rematch":
            restart(G ? G.monsterKey : "rathalos");
            return;
          case "hunt":
            restart(val);
            return;
          case "mute":
            toggleMute();
            return;
          case "auto":
            CONFIG.AUTO = !CONFIG.AUTO;
            $("autoBtn").textContent =
              `BATTLE TEXT: ${CONFIG.AUTO ? "AUTO" : "CLICK"}`;
            return;
          case "putall":
            putAllInBox();
            return;
          case "closebox":
            Audio8.sfx("back");
            closeStorage();
            return;
          case "wipebox":
            BOX = { ...defaultBox(), weapon: BOX.weapon, muted: BOX.muted };
            saveBox();
            renderStorage();
            return;
          case "advance":
            doAdvance();
            return;
          case "menu":
            pickMenu(+val);
            return;
          case "closemap":
            closeMap();
            return;
          case "carve":
            doCarve();
            return;
        }
        if (!G || G.over) return;

        if (G.screen === "field") {
          switch (act) {
            case "fa":
              if (menuState) pickMenu(menuState.idx);
              else if (mapResolve) closeMap();
              else if (storeResolve) closeStorage();
              else if (canAct()) interact();
              break;
            case "fb":
              cancelMenu();
              closeMap();
              closeStorage();
              break;
            case "fstart":
              if (canAct()) openStartMenu();
              break;
            case "fmap":
              if (canAct()) flow(openMap);
              break;
            case "fbag":
              if (canAct()) flow(fieldBag);
              break;
          }
          return;
        }

        if (G.busy) return;
        switch (act) {
          case "fight":
            Audio8.sfx("select");
            setMode("fight");
            break;
          case "bag":
            Audio8.sfx("select");
            setMode("bag");
            break;
          case "map":
            flow(async () => {
              await openMap();
              return "main";
            });
            break;
          case "run":
            confirmRun();
            break;
          case "back":
            goBack();
            break;
          case "move":
            pickMove(val);
            break;
          case "part":
            confirmAttack(UI.data.moveId, val);
            break;
          case "item":
            useItemBattle(val);
            break; // instant, no confirmation
          case "yes":
            Audio8.sfx("select");
            runTurn(UI.data.action);
            break;
          case "no":
            Audio8.sfx("back");
            setMode(UI.data.back, UI.data.backData || {});
            break;
        }
      });

      // Hover info for FIGHT (move details) and BAG (item description)
      $("panel").addEventListener("mouseover", (e) => {
        const t = e.target.closest("[data-info]");
        if (!t || !G || !G.foe) return;
        if (UI.mode === "fight") {
          const mv = findMove(t.dataset.info);
          if (mv && $("mInfo")) $("mInfo").innerHTML = moveInfo(mv);
        }
        if (UI.mode === "bag" && $("bagInfo")) {
          const k = t.dataset.info,
            it = ITEMS[k];
          $("bagInfo").innerHTML =
            `${pimg(DATA["item_" + k])} ${it.name}<br>${it.desc}<div class="sub">ITEMS USED ${G.itemsUsed}/${CONFIG.MAX_ITEMS_PER_TURN} THIS TURN</div>`;
        }
      });

      const KEYDIR = {
        ArrowUp: "up",
        ArrowDown: "down",
        ArrowLeft: "left",
        ArrowRight: "right",
        w: "up",
        s: "down",
        a: "left",
        d: "right",
      };
      document.addEventListener("keydown", (e) => {
        Audio8.init();
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
        const dir = KEYDIR[k],
          isA = k === "z" || k === " ",
          isEnter = k === "Enter",
          isB = k === "x" || k === "Escape";
        if (dir || k === " ") e.preventDefault();
        if (k === "n") {
          toggleMute();
          return;
        }
        if (!G) return;
        if (storeResolve) {
          if (isA || isB || isEnter) closeStorage();
          return;
        }
        if (!$("rewardOv").classList.contains("hidden")) {
          if (
            (isA || isEnter) &&
            G.over &&
            !G.boxed &&
            (G.outcome === "slay" || G.outcome === "capture")
          )
            putAllInBox();
          return;
        }
        if (mapResolve) {
          if (isA || isB || isEnter || k === "m") closeMap();
          return;
        }
        if (menuState) {
          if (dir === "up" || dir === "left") moveMenu(-1);
          else if (dir === "down" || dir === "right") moveMenu(1);
          else if (isA || isEnter) pickMenu(menuState.idx);
          else if (isB) cancelMenu();
          return;
        }
        if (dir && G.screen === "field") {
          if (!e.repeat) {
            dirStack = dirStack.filter((x) => x !== dir);
            dirStack.push(dir);
          }
          return;
        }
        if (typing || advance) {
          if (isA || isEnter || isB) doAdvance();
          return;
        }
        if (UI.mode === "carve" && carveResolve) {
          if (isA || isEnter) doCarve();
          return;
        }
        if (G.over) return;
        if (G.screen === "field") {
          if (!canAct()) return;
          if (isA) interact();
          else if (isEnter || k === "Escape") openStartMenu();
          else if (k === "m") flow(openMap);
        } else if (isB) goBack();
      });
      document.addEventListener("keyup", (e) => {
        const k = e.key.length === 1 ? e.key.toLowerCase() : e.key,
          dir = KEYDIR[k];
        if (dir) dirStack = dirStack.filter((x) => x !== dir);
      });
      window.addEventListener("blur", () => {
        dirStack = [];
      });

      // On-screen D-pad: hold to walk; also moves the cursor in menus
      let heldDir = null;
      document.addEventListener("pointerdown", (e) => {
        const b = e.target.closest("[data-dir]");
        if (!b) return;
        e.preventDefault();
        heldDir = b.dataset.dir;
        b.classList.add("on");
        if (menuState) {
          moveMenu(heldDir === "up" || heldDir === "left" ? -1 : 1);
          return;
        }
        dirStack = dirStack.filter((x) => x !== heldDir);
        dirStack.push(heldDir);
      });
      function releaseDir() {
        if (!heldDir) return;
        dirStack = dirStack.filter((x) => x !== heldDir);
        heldDir = null;
        document
          .querySelectorAll(".dpad .on")
          .forEach((b) => b.classList.remove("on"));
      }
      document.addEventListener("pointerup", releaseDir);
      document.addEventListener("pointercancel", releaseDir);

      /* =====================================================================
   STEP 22 — MAIN LOOP & BOOT (no title screen: straight into Base Camp)
   ===================================================================== */
      let lastT = performance.now();
      function loop(now) {
        const dt = Math.min(50, now - lastT);
        lastT = now;
        if (G && G.screen === "field") {
          updateField(dt, now);
          if (G && G.screen === "field") drawField(now);
        }
        renderMini();
        requestAnimationFrame(loop);
      }

      $("eParts").innerHTML = Object.keys(PARTS)
        .map(
          (k) =>
            `<div class="pt" id="pb-${k}"><span>${PARTS[k].label}</span><div class="trk"><div class="fill"></div></div></div>`,
        )
        .join("");
      {
        const marks = $("pSharp").parentElement.querySelectorAll("i");
        marks[0].style.left =
          (CONFIG.SHARP_YELLOW / CONFIG.SHARP_MAX) * 100 + "%";
        marks[1].style.left =
          (CONFIG.SHARP_GREEN / CONFIG.SHARP_MAX) * 100 + "%";
      }
      $("muteBtn").textContent = `♪ MUSIC: ${Audio8.muted ? "OFF" : "ON"}`;
      newGame("rathalos");
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
